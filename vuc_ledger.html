      box.appendChild(el("h2", { text:"今日の一手" }));
      box.appendChild(el("p", { class:"note", text: waitingState(focus) }));
    }
    root.appendChild(box);
    /* 未充足エビデンスの解決候補（勝手に解決済みにはしない） */
    (focus.unmetEvidence||[]).forEach(function(u){
      if (u._askResolve && !u.resolvedAt){
        root.appendChild(el("div", { class:"card" }, [
          el("p", { text:"「" + u.text + "」は解決できていませんか？（関連する欄に値が入りました）" }),
          el("div", { class:"row" }, [
            el("button", { class:"btn primary", type:"button", text:"確認できた",
                           onclick:function(){ resolveUE(focus, u.id); } }),
            el("button", { class:"btn", type:"button", text:"まだ",
                           onclick:function(){ delete u._askResolve; renderAll(); } })
          ])
        ]));
      }
    });
  }

  if (fresh) return;

  /* 4 要注意 */
  var att = attentionItems(S.data, T);
  if (att.length){
    var abox = el("div", { class:"card" }, [el("h2", { text:"要注意（" + att.length + "件）" })]);
    var aul = el("ul", { class:"plain" });
    att.slice(0, T.attentionMax).forEach(function(a){
      aul.appendChild(el("li", {}, [
        el("button", { class:"btn link", type:"button", text:a.vucId,
                       onclick:function(){ S.focusVuc = a.vucId; renderAll(); } }),
        document.createTextNode("  " + a.text)
      ]));
    });
    abox.appendChild(aul);
    if (att.length > T.attentionMax){
      abox.appendChild(el("button", { class:"btn link", type:"button",
        text:"ほか " + (att.length - T.attentionMax) + "件（一覧で見る）",
        onclick:function(){ S.showClosed = false; go("log"); } }));
    }
    root.appendChild(abox);
  }

  /* 5 他のVUC */
  var others = vucs.filter(function(v){ return !focus || v.id !== focus.id; });
  if (others.length){
    var obox = el("div", { class:"card" }, [el("h2", { text:"他のVUC" })]);
    var oul = el("ul", { class:"plain" });
    others.forEach(function(v){
      var a0 = v.closed ? null : nextActions(v, T)[0];
      oul.appendChild(el("li", {}, [
        el("button", { class:"btn link", type:"button", text:v.id,
                       onclick:function(){ S.focusVuc = v.id; renderAll(); } }),
        document.createTextNode("  " + (v.title || "（表題なし）") + "　"),
        el("span", { class:"badge", text:v.state }),
        document.createTextNode("　"),
        el("span", { class:"small muted",
                     text: v.closed ? ("終了（" + (v.closed === "killed" ? "Kill" : "Pivot") + "）")
                                    : (a0 ? "→ " + a0.action : waitingState(v)) })
      ]));
    });
    obox.appendChild(oul);
    root.appendChild(obox);
  }
}
/* その一手を押したときに開く側。順序8は実測、それ以外は期待値から。
   ただしユーザーが書いたメモ（順序2・9）が期待実測の欄を指していて、期待値が既に埋まっている
   ときは実測側を開く。常に期待値を開くと、実測を書きたいメモから実測欄へ行けない */
function actionSide(a, vuc){
  if (a.order === 8) return "observed";
  if (a.ueId && a.fieldKey){
    var f = FIELD_BY_KEY[a.fieldKey];
    if (f && f.t === "pair"){
      var c = cellOf(vuc, a.fieldKey);
      if (pairFilled(c, "expected") && !pairFilled(c, "observed")) return "observed";
    }
  }
  return "expected";
}
/* その一手が航海のどこに関わるか。航海図と「今日の一手」が食い違って見えないようにする */
function actionScope(a, vuc){
  if (a.order === 1) return "判断期限（段とは別に、いま対応する）";
  if (a.order === 2) return "自分で書いた未確認事項";
  if (a.order === 3) return "採算";
  if (a.order === 4 || a.order === 5) return "着手の判定（ゲート4条件。段とは別に進められる）";
  if (a.order === 6) return "いま向かっている段：" + (nextStateOf(vuc.state) || vuc.state);
  if (a.order === 7) return "実装への引き渡し（L4で必要）";
  if (a.order === 8) return "実測（L5で必要）";
  if (a.order === 9) return "自分で書いた未確認事項（いまは何も止めていない）";
  return "";
}
function stateLabel(k){
  var s = STATES.filter(function(x){ return x.k === k; })[0];
  return s ? (s.k + "（" + s.ja + "）") : k;
}
function resolveUE(vuc, ueId){
  (vuc.unmetEvidence||[]).forEach(function(u){
    if (u.id === ueId){ u.resolvedAt = todayISO(); delete u._askResolve; }
  });
  logChange(vuc, "field", "unmetEvidence", ueId, "resolved");
  touchProject(); renderAll();
}

/* =========================================================================
   6.7.2 画面2「VUCを作る」：第1段でひと区切り、続きは任意
   ========================================================================= */
var WIZ1 = [
  { q:"この案に名前をつけると？",       key:"title" },
  { q:"困っているのは誰？",             key:"fields.customer" },
  { q:"それはどんな場面で起きる？",     key:"fields.trigger" },
  { q:"どうなれば解決したと言える？",   key:"fields.goal" }
];
var WIZ2 = [
  { q:"その人はいま、どうやってしのいでいる？", key:"fields.workaround",       skip:"あとで書く" },
  { q:"その不便は、年いくらの損になっている？", key:"fields.painCost.expected", skip:"あとで測る", skipFirst:true },
  { q:"金を出すのは誰？",                       key:"fields.payer",            skip:"まだ分からない" },
  { q:"今週わかるようにしたい仮説はどれ？",     key:"unmetEvidence",           skip:"あとで書く" }
];
function startWizard(vucId, stage){
  S.wizard = { vucId: vucId || null, stage: stage || 1, step: 0, answers: {} };
  go("create");
}
function renderCreate(){
  var root = document.getElementById("screen-create");
  root.innerHTML = "";
  if (!S.wizard){
    root.appendChild(el("div", { class:"card" }, [
      el("h2", { text:"VUCを作る" }),
      el("p", { text:"4つだけ聞きます。分からないものは飛ばせます" }),
      el("p", { class:"row" }, [el("button", { class:"btn primary big", type:"button", text:"はじめる",
                                  onclick:function(){ startWizard(); } }), helpBtn("wizard.start")])
    ]));
    return;
  }
  var w = S.wizard;
  var list = w.stage === 1 ? WIZ1 : WIZ2;
  if (w.step >= list.length){ finishStage(); return; }
  var item = list[w.step];
  var box = el("div", { class:"card" });
  box.appendChild(el("div", { class:"small muted",
    text:(w.stage === 1 ? "第1段 VUCメモ" : "第2段 VUC-Lite へ（任意・いつでも中断できます）")
       + "　" + (w.step + 1) + " / " + list.length }));
  var fk = item.key.replace(/\.expected$/, "");
  var f = FIELD_BY_KEY[fk === "unmetEvidence" ? "unmetEvidence[]" : fk];
  var hkey = f ? ("field:" + f.k) : "wizard.next";
  box.appendChild(el("h2", { style:"display:flex;gap:6px;align-items:center;flex-wrap:wrap" },
    [document.createTextNode(item.q), helpBtn(hkey)]));
  if (f) box.appendChild(el("p", { class:"note", text:f.hint + "　（" + chapterText(f.canon) + "）" }));
  var exLine = f && FIELD_EXAMPLES[f.k] ? String(FIELD_EXAMPLES[f.k]).split("\n")[0] : "";

  var inp;
  if (item.key === "fields.painCost.expected"){
    inp = el("input", { type:"number", step:"any", placeholder: exLine ? "例：" + exLine : "" });
  } else {
    inp = el("input", { type:"text", placeholder: exLine ? "例：" + exLine : "" });
  }
  inp.addEventListener("keydown", function(e){ if (e.key === "Enter"){ e.preventDefault(); answer(inp.value); } });
  box.appendChild(el("div", { class:"field" }, [
    el("div", { class:"row" }, [inp, helpBtn(hkey)])
  ]));

  var bar = el("div", { class:"row" });
  var skipBtn = item.skip ? el("button", { class:"btn", type:"button", text:"［" + item.skip + "］",
                                           onclick:function(){ answer(null); } }) : null;
  var nextBtn = el("button", { class:"btn primary", type:"button",
                               text:(w.step === list.length - 1 ? "できた" : "次へ"),
                               onclick:function(){ answer(inp.value); } });
  /* 手順6の［あとで測る］は、選択肢の先頭に置く（飛ばすのが既定） */
  if (item.skipFirst && skipBtn){ bar.appendChild(skipBtn); bar.appendChild(helpBtn("wizard.skip"));
                                  bar.appendChild(nextBtn); bar.appendChild(helpBtn("wizard.next")); }
  else { bar.appendChild(nextBtn); bar.appendChild(helpBtn("wizard.next"));
         if (skipBtn){ bar.appendChild(skipBtn); bar.appendChild(helpBtn("wizard.skip")); } }
  box.appendChild(bar);
  if (w.stage === 1 && w.step === 0 && !w.vucId)
    box.appendChild(el("p", { class:"small muted", text:"Enter で次へ進めます" }));
  root.appendChild(box);
  inp.focus();

  function answer(val){
    var v = (val === null || String(val).trim() === "") ? null : String(val).trim();
    w.answers[item.key] = v;
    /* 第2段は1問でも終えるたびに保存する。途中で閉じても答えた分は残る（6.7.2） */
    if (w.stage === 2 && w.vucId && v !== null){
      var target = findVuc(w.vucId);
      if (target){ applyWizardAnswer(target, item.key, v); touchProject(); }
    }
    w.step++;
    if (w.step >= list.length) finishStage(); else renderCreate();
  }
}
function finishStage(){
  var w = S.wizard;
  var vuc = w.vucId ? findVuc(w.vucId) : null;
  if (!vuc){
    S.data.seq.vuc++;
    vuc = newVuc(S.data.seq.vuc);
    S.data.vucs.push(vuc);
    w.vucId = vuc.id;
  }
  /* 第1段はまとめて書く（VUCはここで生まれる）。第2段は1問ごとに書き済み */
  if (w.stage === 1){
    Object.keys(w.answers).forEach(function(k){
      if (w.answers[k] !== null) applyWizardAnswer(vuc, k, w.answers[k]);
    });
  }
  vuc.assurance = computeAssurance(vuc);
  if (!vuc.targetState) vuc.targetState = nextStateOf(vuc.state);
  touchProject();

  var stage = w.stage;
  S.wizard = null;
  if (stage === 1 && S.data.vucs.length === 1) S.justCreatedFirst = true;
  showCompletionCard(vuc, stage);
}
/* ウィザードで入れた値の根拠は、すべて assumption（仮説）で入る（6.7.2） */
function applyWizardAnswer(vuc, k, val){
  if (val === null || val === "") return;
  if (k === "title"){ vuc.title = val; logChange(vuc, "field", "title", null, val); return; }
  if (k === "unmetEvidence"){ addUnmetEvidence(vuc, val, null); return; }
  if (k === "fields.painCost.expected"){
    var pc = vuc.fields.painCost;
    pc.expected = Number(val); pc.blank.expected = null;
    pc.source.expected = newSource("assumption");
    logChange(vuc, "field", "fields.painCost.expected", null, pc.expected);
    return;
  }
  var cell = cellOf(vuc, k);
  if (cell){
    cell.v = val; cell.blank = null; cell.source = newSource("assumption");
    logChange(vuc, "field", k, null, val);
  }
  vuc.assurance = computeAssurance(vuc);
}
function addUnmetEvidence(vuc, text, fieldKey){
  vuc.seqs.ue++;
  var u = { id:"UE-" + String(vuc.id).replace("VUC-","") + "-" + vuc.seqs.ue,
            text:text, field:fieldKey || null, blocks:defaultBlocksFor(fieldKey),
            since:todayISO(), resolvedAt:null };
  vuc.unmetEvidence.push(u);
  logChange(vuc, "field", "unmetEvidence", null, u.id);
  return u;
}
/* 完了時のカードは6行。未入力の欄は空白にせず「未確認」と出す */

     「止める条件がもう決まっていれば書く」任意の欄としてだけ持つ（6.7.2） */
  if (!stopCriteriaWritten(vuc) && !vuc.closed){

    var sDate = el("input", { type:"date" });
    body.push(el("details", {}, [

      el("p", { class:"small muted", text:"決まっていなければ飛ばして構いません。開発に着手する段（L3）へ上げるときに、あらためて聞きます" }),
      el("div", { class:"grid2" }, [
        el("div", { class:"field" }, [el("label", { text:"何を見て止めるか" }), sTarget]),
        el("div", { class:"field" }, [el("label", { text:"いくつ下回ったら止めるか" }), sNum])
      ]),
      el("div", { class:"grid2" }, [
        el("div", { class:"field" }, [el("label", { text:"単位" }), sUnit]),
        el("div", { class:"field" }, [el("label", { text:"いつ判断するか" }), sDate])
      ]),
      el("button", { class:"btn", type:"button", text:"この条件で書く", onclick:function(){
        if (!sTarget.value.trim() || sNum.value === "" || !sDate.value){
          toast("指標としきい値、判断期限がそろうと書けます（単位はプルダウンから選びます）", "warn"); return;
        }
        vuc.stopCriteria = { target:sTarget.value.trim(), threshold:Number(sNum.value),
                             unit:sUnit.value, deadline:sDate.value, writtenAt:todayISO() };
        logChange(vuc, "field", "stopCriteria.target", null, vuc.stopCriteria.target);
        touchProject(); closeSheet(); renderAll();

      }})
    ]));

  if (stage === 1 && !isLiteDone(vuc)){
    acts.push(el("button", { class:"btn", type:"button",

      onclick:function(){ closeSheet(); startWizard(vuc.id, 2); } }));
  }
  acts.push(el("button", { class:"btn primary", type:"button", text:"今日の一手へ",
    onclick:function(){ closeSheet(); S.focusVuc = vuc.id; go("today"); } }));
  showSheet(stage === 1 ? "できました" : "ここまで保存しました", body, acts);
  renderAll();
}
function cellText(vuc, key){
  var cell = cellOf(vuc, key);
  if (!cell) return "未確認";
  if (cell.blank === "na") return "該当なし";
  if (cell.blank) return "未確認";

/* ---- 上段：実測を入れる（expected に値が入っている欄だけを並べる） ---- */
function renderMeasureUpper(root, vuc){
  var box = el("div", { class:"card" }, [el("h2", { text:vuc.id + " を測る" })]);
  var rows = CELL_FIELDS.filter(function(f){
    return f.t === "pair" && !f.sub && pairFilled(cellOf(vuc, f.k), "expected");
  });
  if (!rows.length){
    box.appendChild(el("p", { class:"muted", text:"期待値が入っている欄がまだありません。期待値を書くと、ここに実測の入力欄が出ます" }));
    root.appendChild(box); return;
  }
  var tbl = el("table");
  tbl.appendChild(el("tr", {}, [el("th", { text:"欄" }), el("th", { class:"num", text:"期待" }),
    el("th", { class:"num" }, [document.createTextNode("実測"), helpBtn("measure.observed")]),
    el("th", {}, [document.createTextNode("出所"), helpBtn("measure.source")]), el("th", { text:"差" })]));
  rows.forEach(function(f){
    var cell = cellOf(vuc, f.k);
    var obs = el("input", { type:"number", step:"any" });
    obs.value = (cell.observed === null || cell.observed === undefined) ? "" : cell.observed;
    obs.disabled = isReadOnly(vuc);
    var src = sourceSelect(cell.source ? cell.source.observed : null);
    src.disabled = isReadOnly(vuc);
    function commit(){
      var raw = obs.value.trim();
      var before = cell.blank.observed ? cell.blank.observed : cell.observed;
      if (raw === ""){ cell.observed = null; cell.blank.observed = "not_measured"; cell.source.observed = null; }
      else {
        cell.observed = Number(raw); cell.blank.observed = null;
        /* 既定を固い側に置かない（6.2.1）。出所が未選択なら埋めずに警告する（V5） */
        cell.source.observed = src.value ? newSource(src.value) : null;
        if (!src.value) toast(f.label + "に実測値が入っていますが、どこから来た値かが空です（V5）", "warn");
      }
      logChange(vuc, "field", f.k + ".observed", before, cell.blank.observed ? cell.blank.observed : cell.observed);
      touchProject(); renderAll();
    }
    obs.addEventListener("change", commit);
    src.addEventListener("change", function(){
      if (cell.observed !== null && cell.observed !== undefined){
        cell.source.observed = src.value ? newSource(src.value) : null; touchProject();
      }
    });
    var diff = "―";
    if (pairFilled(cell, "expected") && pairFilled(cell, "observed") && cell.expected){
      var d = ((cell.observed - cell.expected) / cell.expected) * 100;
      diff = fmtNum(cell.observed) + "（" + (d >= 0 ? "+" : "") + fmtNum(d) + "%）";
    }
    tbl.appendChild(el("tr", {}, [
      el("td", {}, [document.createTextNode(f.label), helpBtn("field:" + f.k),
                    el("div", { class:"small muted", text:cell.unit || "" })]),
      el("td", { class:"num", text:fmtNum(cell.expected) }),
      el("td", {}, [obs]), el("td", {}, [src]), el("td", { text:diff })
    ]));
  });
  box.appendChild(tbl);
  box.appendChild(el("p", { class:"small muted", text:"期待値の根拠はこの画面では触りません（R2）。変えるときは1欄編集面から行います" }));
  if (!isReadOnly(vuc)){
    box.appendChild(el("div", { class:"row" }, [
      el("button", { class:"btn", type:"button", text:"この期間の実測として確定",
        onclick:function(){ confirmObservation(vuc); } }), helpBtn("measure.period") ]));
  }
  if ((vuc.economics.observations||[]).length){
    var ot = el("table");
    ot.appendChild(el("tr", {}, [el("th", { text:"期間" }), el("th", { class:"num", text:"K" }),
      el("th", { class:"num", text:"P" }), el("th", { class:"num", text:"Q" }), el("th", { class:"num", text:"c" }),
      el("th", { class:"num", text:"U" }), el("th", { class:"num", text:"貢献利益" })]));
    vuc.economics.observations.forEach(function(o){

    else line.appendChild(el("div", { class:"small muted", text:"貢献利益が0以下のため、開発費の回収月数は出しません" }));
    if (e.source && e.source.status === "draft_ai")
      line.appendChild(el("div", { class:"note warn", text:"前提にAI下書きが混ざっています。この値は判定に使えません（V8）" }));
    box.appendChild(line);
    if (e.contribution <= 0){
      var bk = computeBreakeven(e);
      if (bk.length){
        var bx = el("div", { class:"note" }, [el("div", { text:"どれか1つを、次の水準まで動かせば成立します" })]);
        var bt = el("table");

            el("td", { text:b.label }),

            el("td", { class:"num small muted", text: b.pct === null ? "" : "（" + (b.pct >= 0 ? "+" : "") + fmtNum(b.pct) + "%）" })

        box.appendChild(bx);
      }
    }
    /* 6.9.3 ゲート条件3は自動で確定させない */
    if (!isReadOnly(vuc)){
      var g3 = vuc.gate4.unitEconomics;
      /* V8：根拠が draft_ai の値は、ゲート判定の根拠にしてはいけない。未測定として扱う */
      var ej = computeEconomics(vuc, side, { judge:true });
      var g3ok = ej.complete;
      var g3btn = el("button", { class:"btn", type:"button", text:"成立にする", onclick:function(){
          g3.pass = true;

          vuc.gate4.result = gateResult(vuc);
          logChange(vuc, "field", "gate4.unitEconomics", null, true);
          touchProject(); renderAll();
        }});
      if (!g3ok) g3btn.disabled = true;
      box.appendChild(el("div", { class:"row", style:"margin-top:8px" }, [
        el("span", { text:"ゲート条件3を「成立」にしますか？" }), helpBtn("measure.gate3"),
        g3btn,
        el("button", { class:"btn", type:"button", text:"まだ確定しない", onclick:function(){
          toast("条件3は未判定のままにしました");
        }}),
        g3.pass === true ? el("span", { class:"badge ok", text:"成立にした" }) : null

      if (!g3ok){
        box.appendChild(el("p", { class:"note warn",
          text:"前提にAI下書き（未確認）が混ざっているため、この計算はゲート条件3の根拠に使えません。"
             + "該当する欄を人が確認して確定させると、押せるようになります（足りない：" + ej.missing.join("・") + "）" }));
      }
    }
  }
  box.appendChild(el("p", { class:"small muted",
    text:"※ この計算には含まれない：顧客獲得原価と変更原価、期待損失（第3章）。L4以降の精度が要るときは、JSONを表計算へ出して続けてください。" }));
  root.appendChild(box);
}

function addTraceRow(vuc, layer, num){
  var name = "", id = "";
  if (layer === "adr"){
    id = prompt("ADRのID（通し番号が独立するので手入力。例：ADR-031）");
    if (!id) return;
  } else {
    name = prompt(TRACE_LAYER_LABEL[layer] + " の名前");
    if (!name) return;
    vuc.seqs[layer]++;
    if (layer === "buc") id = "BUC-" + num + "-" + vuc.seqs.buc;
    else if (layer === "suc"){
      var b = (vuc.trace.buc[0] || { id:"BUC-" + num + "-1" }).id.replace("BUC-","");

/* ---- 下段：判定する ---- */
function renderJudge(root, vuc, T){

  var tbl = el("table");
  GATE_KEYS.forEach(function(k){
    var f = FIELD_BY_KEY["gate4." + k], g = vuc.gate4[k];
    var sel = el("select", { onchange:function(e){
      var before = g.pass;
      g.pass = e.target.value === "true" ? true : (e.target.value === "false" ? false : null);
      vuc.gate4.result = gateResult(vuc);
      logChange(vuc, "field", "gate4." + k, before, g.pass);
      touchProject(); renderAll();
    }});
    [["null","まだ判定していない"],["true","通過"],["false","不成立"]].forEach(function(o){
      sel.appendChild(el("option", { value:o[0], text:o[1] }));
    });
    sel.value = g.pass === true ? "true" : (g.pass === false ? "false" : "null");
    sel.disabled = isReadOnly(vuc);
    var evi = el("input", { type:"text", placeholder:"根拠（1行）" });
    evi.value = g.evidence || ""; evi.disabled = isReadOnly(vuc);
    evi.addEventListener("change", function(){ g.evidence = evi.value.trim(); touchProject(); });
    tbl.appendChild(el("tr", {}, [
      el("td", {}, [document.createTextNode(f.label), helpBtn("field:gate4." + k),
                    el("div", { class:"small muted", text:f.hint })]),
      el("td", {}, [sel]), el("td", {}, [evi])
    ]));
  });
  box.appendChild(el("div", { class:"row" }, [el("span", { class:"small muted", text:"4つの条件" }), helpBtn("measure.gate4")]));
  box.appendChild(tbl);
  /* 判定結果は肯定的な文で出す */
  var msg, cls;

  else {

      msg = "この価格では採算が立たない。価格と頻度、AI原価、サポートのどれを変えるか決める"; cls = "note warn";
    } else if (fails.length){
      msg = "いまは着手しない方がよい。確認すべきは " + fails.length + "件（"
          + fails.map(function(k){ return FIELD_BY_KEY["gate4."+k].label; }).join("・") + "）"; cls = "note warn";
    } else {
      msg = "いまは着手しない方がよい。確認すべきは " + undec.length + "件（"
          + undec.map(function(k){ return FIELD_BY_KEY["gate4."+k].label; }).join("・") + "）"; cls = "note";
    }
  }
  box.appendChild(el("p", { class:cls, text:msg }));
  box.appendChild(el("p", { class:"small muted", text:"4条件すべてが通過したときだけ成立。論理積であり、点数ではありません（R3）" }));

  if (!isReadOnly(vuc)){
    var crit = el("input", { type:"text", placeholder:"なぜそう判断したかを1行で（V11）" });
    crit.value = vuc.gate.criteria || "";
    crit.addEventListener("change", function(){
      var b = vuc.gate.criteria; vuc.gate.criteria = crit.value.trim();
      logChange(vuc, "field", "gate.criteria", b, vuc.gate.criteria); touchProject();
    });
    box.appendChild(el("div", { class:"field" }, [labelWithHelp("判定の根拠", "measure.criteria"), crit]));
    var target = vuc.targetState || nextStateOf(vuc.state) || vuc.state;
    box.appendChild(el("div", { class:"row" }, [
      el("button", { class:"btn primary", type:"button", text:"この仮説を続ける（Continue）",
        onclick:function(){ doContinue(vuc, crit); } }), helpBtn("measure.continue"),
      el("button", { class:"btn", type:"button", text:"別の仮説として作り直す（Pivot）",
        onclick:function(){ doClose(vuc, "pivoted", crit); } }), helpBtn("measure.pivot"),
      el("button", { class:"btn", type:"button", text:"この仮説は終える（Kill）",
        onclick:function(){ doClose(vuc, "killed", crit); } }), helpBtn("measure.kill"),

}
function doContinue(vuc, critInput){

    el("p", { class:"note", text:"次にゲートを見る日を1つだけ決めます（空のままでも確定できます）" }),

  ], [

function doClose(vuc, type, critInput){
  if (critInput) vuc.gate.criteria = critInput.value.trim();
  var errs = validate(vuc, "decision", st()).filter(function(x){ return x.level === "block"; });
  if (errs.length){ showValidation(vuc, errs); return; }
  var cat = el("select");
  CLOSURE_CATEGORIES.forEach(function(c){ cat.appendChild(el("option", { value:c.k, text:c.label })); });
  var why = el("input", { type:"text", placeholder:"理由を1行で" });
  showSheet(type === "killed" ? "この仮説は終える" : "別の仮説として作り直す", [

      : "内部の呼び名は Pivot です。後継のVUCを1本つくってリンクします（後継なしでは確定できません・V10）" }),
    el("div", { class:"field" }, [el("label", { text:"分類" }), cat]),

  ], [

      }
      var successor = null;
      if (type === "pivoted"){
        S.data.seq.vuc++;
        var nv = newVuc(S.data.seq.vuc);
        nv.title = (vuc.title || "") + "（" + vuc.id + " から）";
        nv.parent = vuc.parent;
        ["fields.customer","fields.trigger","fields.goal"].forEach(function(k){
          var src = cellOf(vuc, k), dst = cellOf(nv, k);
          if (src && !src.blank){ dst.v = src.v; dst.blank = null; dst.source = newSource("assumption"); }
        });
        S.data.vucs.push(nv);
        successor = nv.id;
      }
      vuc.closed = type;
      vuc.closure = { at:todayISO(), type:type, category:cat.value, reason:why.value.trim(), successor:successor };
      logChange(vuc, "closed", cat.value, null, type);
      touchProject(); closeSheet(); renderAll();
      toast(type === "killed" ? "終了しました（Kill）。IDは永久欠番です"
                              : "Pivot しました。後継：" + successor);
    }})
  ]);
}
function doPromote(vuc, target, T){
  var step = nextStateOf(vuc.state);
  if (!step){ toast("これ以上は上げられません", "warn"); return; }
  var res = checkPromotion(vuc, step, T);
  if (res.ok){
    var before = vuc.state;
    vuc.state = step;
    if (STATE_KEYS.indexOf(vuc.targetState) <= STATE_KEYS.indexOf(step)) vuc.targetState = nextStateOf(step) || step;
    logChange(vuc, "state", null, before, step);
    touchProject(); renderAll();
    var extra = "";
    if (step === "L5") extra = "\nこの事業では " + T.thresholds.reproductionCount + "回の黒字で再現とみなします";
    toast(before + " → " + step + " に上げました。" + res.rule.gain + extra);
    /* 段の名前が検査の範囲より広いときは、上げた直後に何を検査していないかを言う。
       黙っていると、段の名前のぶんまで検査が済んだと読まれる */
    if (res.rule.caveat) toast(res.rule.caveat, "warn");
    if (res.warnings.length) toast(res.warnings.join("\n"), "warn");
    return;
  }
  var body = [];
  if (res.missing.length){
    body.push(el("p", { text:"この" + res.missing.length + "つが埋まると " + step + " へ上がります" }));
    var ul = el("ul", { class:"plain" });
    res.missing.forEach(function(m){
      ul.appendChild(el("li", {}, [
        document.createTextNode(m.label + "　"),
        el("button", { class:"btn link", type:"button", text:"その欄へ移動", onclick:function(){
          closeSheet(); openFieldEditor(vuc.id, m.field, { side: /\.observed$/.test(m.key) ? "observed" : "expected" });
        }})
      ]));
    });
    body.push(ul);
  }
  res.blocks.forEach(function(b){ body.push(el("p", { class:"note warn", text:b })); });
  body.push(el("p", { class:"small muted", text:"いまは下書きとして保存されています。保存はそのまま通ります" }));
  showSheet(step + " へは、まだ上げられません", body, []);
}

/* ---- 航海日誌の本体：段ごとに「要る欄と書いた値、残り」を読む ----
   値の出し方は1箇所（logValue）に寄せる。画面ごとに書式が違うと、同じ欄が別物に見えるため */
function logValue(vuc, key){
  var m = /^(.*)\.(expected|observed)$/.exec(key);
  var fk = (m && FIELD_BY_KEY[m[1]]) ? m[1] : key, side = m ? m[2] : null;
  var f = FIELD_BY_KEY[fk];
  if (!f) return { text:"―", state:"none", src:"" };
  if (f.cell && f.t === "pair"){
    var c = cellOf(vuc, fk), sd = side || "expected";
    var b = c.blank ? c.blank[sd] : null;
    if (b === "na") return { text:"該当なし", state:"na", src:"" };
    if (b || c[sd] === null || c[sd] === undefined) return { text:"まだ測っていない", state:"none", src:"" };
    var sc = c.source ? c.source[sd] : null;
    return { text: fmtNum(c[sd]) + (c.unit ? " " + c.unit : ""), state:"filled", src: sourceLabel(sc) };
  }
  if (f.cell && f.t !== "pair"){
    var c2 = cellOf(vuc, fk);
    if (c2.blank === "na") return { text:"該当なし", state:"na", src:"" };
    if (c2.blank || c2.v === null || c2.v === "") return { text:"まだ測っていない", state:"none", src:"" };
    return { text:String(c2.v), state:"filled", src: sourceLabel(c2.source) };
  }
  if (f.t === "gate"){
    var g = getPath(vuc, fk) || {};
    var t = g.pass === true ? "通過" : (g.pass === false ? "不成立" : "まだ判定していない");
    return { text:t + (g.evidence ? "：" + g.evidence : ""), state: g.pass === null || g.pass === undefined ? "none" : "filled", src:"" };
  }
  if (/\[\]$/.test(fk)){
    var L = fk.replace("trace.", "").replace("[]", ""), rows = (vuc.trace && vuc.trace[L]) || [];
    if (!rows.length) return { text:"まだ1件もありません", state:"none", src:"" };
    return { text: rows.map(function(r){ return r.id + (r.name ? " " + r.name : "") + "（" + traceStatusLabel(r.status) + "）"; }).join(" ／ "),
             state:"filled", src:"" };
  }
  var v = getPath(vuc, fk);
  if (v === null || v === undefined || v === "") return { text:"まだ書いていません", state:"none", src:"" };
  return { text:String(v), state:"filled", src:"" };
}
function sourceLabel(src){
  if (!src) return "根拠なし";
  var t = SOURCE_TYPES.filter(function(x){ return x.k === src.type; })[0];
  return (t ? t.label : src.type) + (src.status === "draft_ai" ? "（AI下書き）" : "");
}
function traceStatusLabel(s){
  return s === "confirmed" ? "実体を確認した" : (s === "referenced" ? "IDを振った" : "未作成");
}
/* 航海図から飛んできたときに光らせる。どの行かが分かるように id を振る */
function logRowId(stateKey, key){ return "logrow-" + stateKey + "-" + String(key).replace(/[^A-Za-z0-9]/g, "_"); }

                                  el("th", { text:"根拠" }), el("th", { text:"" })]));
      s.fields.forEach(function(fd){
        var val = logValue(focus, fd.key);
        var tr = el("tr", { id: logRowId(L.k, fd.key) }, [

            : el("button", { class:"btn link", type:"button", text: val.state === "filled" ? "直す" : "書く",
                onclick:function(){
                  openFieldEditor(focus.id, fd.field, { side: /\.observed$/.test(fd.key) ? "observed" : "expected" });
                } })])

   6.12 出力
   ========================================================================= */
function decisionCardRows(vuc){
  var T = st();
  var side = economicsSideFor(vuc.state), e = computeEconomics(vuc, side, {});
  var m = measuredCount(vuc, side);
  var passed = GATE_KEYS.filter(function(k){ return vuc.gate4[k].pass === true; });
  var failed = GATE_KEYS.filter(function(k){ return vuc.gate4[k].pass === false; });
  var undec  = GATE_KEYS.filter(function(k){ return vuc.gate4[k].pass === null; });
  var sc = vuc.stopCriteria || {};
  var a0 = nextActions(vuc, T)[0];
  var g4 = [];
  if (passed.length) g4.push("通過：" + passed.map(function(k){ return FIELD_BY_KEY["gate4."+k].label; }).join("・"));
  if (failed.length) g4.push("不成立：" + failed.map(function(k){ return FIELD_BY_KEY["gate4."+k].label; }).join("・"));
  if (undec.length)  g4.push("未判定：" + undec.map(function(k){ return FIELD_BY_KEY["gate4."+k].label; }).join("・"));
  var stop = stopCriteriaWritten(vuc)
    ? (sc.deadline + " までに " + sc.target + " が " + fmtNum(sc.threshold) + sc.unit + " に届かなければ止める")
    : "未確認";
  if (vuc.state === "L5") stop += "／この事業では " + T.thresholds.reproductionCount + "回の黒字で再現とみなす";
  return [
    ["誰の、何を変えるのか", cellText(vuc, "fields.customer") + " の " + cellText(vuc, "fields.goal")],

function applyAiDraft(text, vucId){
  var p = parseWithPosition(text);
  if (!p.ok){
    toast("JSONとして読めません（" + (p.where || p.error) + "）。取り込みは中止しました。部分的に適用した状態では止めていません", "bad");
    return;
  }
  var src = p.value;
  if (src && src.vucs && src.vucs.length) src = src.vucs[0];
  var vuc = vucId ? findVuc(vucId) : null;
  if (!vuc){
    S.data.seq.vuc++; vuc = newVuc(S.data.seq.vuc); S.data.vucs.push(vuc);
  }
  var applied = [], dropped = [];
  Object.keys(src || {}).forEach(function(k){
    var key = k, val = src[k];
    if (key === "title"){
      if (val){ vuc.title = String(val); applied.push("title"); } return;
    }
    var f = FIELD_BY_KEY[key];
    if (!f && FIELD_BY_KEY["fields." + key]) { key = "fields." + key; f = FIELD_BY_KEY[key]; }
    if (!f && FIELD_BY_KEY["economics." + key]) { key = "economics." + key; f = FIELD_BY_KEY[key]; }
    if (!f || !f.cell){ dropped.push(k + "（知らない欄）"); return; }
    var note = "AI下書き / 取込 " + todayISO();
    if (f.t !== "pair"){
      if (val === null || val === undefined || String(val).trim() === ""){ dropped.push(k + "（空）"); return; }
      /* 列挙の欄に選択肢の外の語が入ると、画面は空に見えるのに値だけ残る（silent failure） */
      if (f.t === "enum" && f.units.indexOf(String(val).trim()) < 0){
        dropped.push(k + "（選べるものに無い値：" + String(val).trim() + "）"); return;
      }
      var cell = cellOf(vuc, key);
      cell.v = String(val).trim(); cell.blank = null;
      cell.source = { type:"ai_draft", status:"draft_ai", note:note };
      applied.push(f.label);
    } else {
      var num = (typeof val === "object" && val !== null) ? val.expected : val;
      if (num === null || num === undefined || isNaN(Number(num))){ dropped.push(k + "（数値ではない）"); return; }
      var pc = cellOf(vuc, key);
      pc.expected = Number(num); pc.blank.expected = null;         /* AI下書きは expected にしか入らない */
      pc.blank.observed = pc.blank.observed || "not_measured";
      pc.unit = pc.unit || (f.units[0] || null);
      pc.source.expected = { type:"ai_draft", status:"draft_ai", note:note };
      applied.push(f.label);
      if (typeof val === "object" && val !== null && val.observed !== undefined)
        dropped.push(k + ".observed（実測には書き込めません）");
    }
    logChange(vuc, "field", key, null, "draft_ai");
  });
  vuc.assurance = computeAssurance(vuc);
  touchProject(); closeSheet(); renderAll();
  var msg = (applied.length + dropped.length) + "項目のうち " + applied.length + "項目を取り込みました。"
          + dropped.length + "項目は取り込めませんでした";
  toast(msg, dropped.length ? "warn" : undefined);
  if (dropped.length){
    showSheet("取り込めなかった項目", [
      el("p", { class:"small muted", text:"手で貼り直せます。黙って捨ててはいません" }),
      el("ul", { class:"plain" }, dropped.map(function(d){ return el("li", { text:"・" + d }); }))
    ], []);
  }
  /* 規則4：事業判断を誤らせる11欄は、確定に変えるとき確認ダイアログを出す */
  S.confirmGuard = true;
}

/* =========================================================================
   付録E：不変条件テスト（11件）
   実装が完了したと言うための条件は、時間の受入基準（4.4）とこの11件の両方である。
   ここで確かめられるのはブラウザの中だけで、6.4.5 の実機検証は別に人が行う。
   ========================================================================= */
function tmpProject(){
  var d = newProject("自己検査");
  return d;
}
function tmpVuc(d){ d.seq.vuc++; var v = newVuc(d.seq.vuc); d.vucs.push(v); return v; }
function setSingle(v, key, val, type){
  var c = cellOf(v, key); c.v = val; c.blank = null; c.source = newSource(type || "assumption");
}
function setPair(v, key, side, val, type){
  var c = cellOf(v, key); c[side] = val; c.blank[side] = null; c.source[side] = newSource(type || "assumption");
}
async function runSelfTests(container){
  var results = [], T0 = st();
  function ok(id, cond, note){ results.push({ id:id, ok:!!cond, note:note || "" }); }

  /* E1 draft_ai の値だけでは、どの段にも昇格できない（付録D 共通規則・6.2.1） */
  (function(){
    /* 根拠の type は最も強い interview / measurement にしておき、status だけを draft_ai にする。
       こうすると、昇格が止まる理由は「人が確認していない」ことだけになる。 */
    var SINGLES = ["fields.customer","fields.trigger","fields.goal","fields.workaround",
                   "fields.payer","fields.valueHypothesis","fields.valueMetric","fields.wtpEvidence"];
    /* 出所を持つ列挙の欄には台帳の選択肢の語を入れる（自由文だと画面で選べない値になる） */
    function singleVal(k){
      var f = FIELD_BY_KEY[k];
      return (f && f.t === "enum") ? f.units[0] : "確かめた内容";
    }
    var EXP = { "fields.painCost":8000000, "fields.wtp":300000, "economics.K":10, "economics.P":1000,
                "economics.Q":20, "economics.c":10, "economics.U":100, "economics.D":100000 };
    var OBS = { "economics.K":10, "economics.P":1000, "economics.Q":20, "economics.c":10, "economics.U":100 };
    var STAGES = ["L0","L1","L2","L3","L4","L5"];
    function build(singleDraft, pairDraft){
      var d = tmpProject(), v = tmpVuc(d);
      v.title = "根拠の状態だけを変えたVUC";
      SINGLES.forEach(function(k){
        setSingle(v, k, singleVal(k), "interview");
        if (singleDraft) cellOf(v, k).source.status = "draft_ai";
      });
      Object.keys(EXP).forEach(function(k){
        setPair(v, k, "expected", EXP[k], "interview");
        if (pairDraft) cellOf(v, k).source.expected.status = "draft_ai";
      });
      Object.keys(OBS).forEach(function(k){
        setPair(v, k, "observed", OBS[k], "measurement");
        if (pairDraft) cellOf(v, k).source.observed.status = "draft_ai";
      });
      v.stopCriteria = { target:"継続率", threshold:50, unit:"%", deadline:"2027-03-31", writtenAt:todayISO() };
      GATE_KEYS.forEach(function(k){ v.gate4[k] = { pass:true, evidence:"確認した" }; });
      v.gate4.decidedAt = todayISO(); v.gate4.decidedBy = "自己検査";
      ["buc","suc","ac"].forEach(function(L){
        v.trace[L].push({ id:L.toUpperCase() + "-001", label:"", status:"confirmed" });
      });
      v.economics.observations = [
        { period:"2026-08", K:10, contribution:9700, recordedAt:nowISO() },
        { period:"2026-09", K:10, contribution:9800, recordedAt:nowISO() }
      ];
      return v;
    }
    function judge(v, to){
      return checkPromotion(v, to, { thresholds: Object.assign({}, THRESHOLD_DEFAULTS) });
    }
    function blocked(v, to){
      var i = STAGES.indexOf(to);
      v.state = (i > 0) ? STAGES[i-1] : "L0";        /* 段は飛ばせないので直前の段から試す */
      return !judge(v, to).ok;
    }
    /* 下から順に登れるところまで登る。null は L0 の起票条件すら満たさないこと */
    function highest(v){
      var reached = null;
      for (var i = 0; i < STAGES.length; i++){
        v.state = (i > 0) ? STAGES[i-1] : "L0";
        if (!judge(v, STAGES[i]).ok) break;
        reached = STAGES[i];
      }
      return reached;
    }
    /* 対照：根拠が confirmed なら L5 まで登れる。ここが通らないと以下は空振りの検査になる */
    var controlOk = highest(build(false, false)) === "L5";
    /* 両方の経路が draft_ai：1段も登れない */
    var both = build(true, true);
    var cannotClimb = highest(both) === null;
    /* 段ごとに見ても止まる。L4 だけは必須がトレースの接続で根拠を持たないので、
       draft_ai では止まらず、段を飛ばせない規則（付録D）によって到達できない */
    var eachBlocked = ["L0","L1","L2","L3","L5"].every(function(to){ return blocked(both, to); });
    /* 片方だけ draft_ai：その経路を必須欄に持つ段が止まる（もう片方の経路で素通りしない） */
    var sOnly = build(true, false), pOnly = build(false, true);
    var viaSingle = ["L0","L1","L2"].every(function(to){ return blocked(sOnly, to); });
    var viaPair = ["L1","L2","L3","L5"].every(function(to){ return blocked(pOnly, to); });
    ok("E1", controlOk && cannotClimb && eachBlocked && viaSingle && viaPair,
       "根拠が draft_ai の値は、単一値と期待実測のどちらの経路でも、どの段の昇格にも使えない");
  })();

  /* E2 observed を入力しても expected が残る */
  (function(){
    var d = tmpProject(), v = tmpVuc(d);
    setPair(v, "fields.wtp", "expected", 300000, "interview");
    var before = cellOf(v, "fields.wtp").expected;
    setPair(v, "fields.wtp", "observed", 280000, "measurement");
    ok("E2", cellOf(v, "fields.wtp").expected === before, "期待値は実測入力の前後で同値");
  })();

  /* E3 JSONを書き出して読み直しても、空欄3区分が1欄も変わらない（6.2.1・付録C） */
  (function(){
    /* 突き合わせる欄は付録Cの表から並べる。読み直した側の中身から作ると、
       欄ごと欠落したときに検査の対象からも消えて気づけない。 */
    function naSingle(c){ c.v = null; c.blank = "na"; c.source = null; }
    function naPair(c, side){ c[side] = null; c.blank[side] = "na"; c.source[side] = null; }
    function pairVal(f){ return f.sub === "tokens" ? { tIn:1000, pIn:150, tOut:500, pOut:600 } : 12345; }
    var d = tmpProject(), v = tmpVuc(d), want = [];
    v.title = "空欄3区分を混ぜたVUC";
    CELL_FIELDS.forEach(function(f, i){
      if (f.t !== "pair"){
        var kind = i % 3;                                   /* 1 は初期値の not_measured のまま */
        if (kind === 0) setSingle(v, f.k, f.t === "enum" ? f.units[0] : "確かめた内容", "interview");
        else if (kind === 2) naSingle(cellOf(v, f.k));
        want.push({ key:f.k, side:null });
      } else {
        ["expected","observed"].forEach(function(side, j){
          var kind = (i + j) % 3;
          if (kind === 0) setPair(v, f.k, side, pairVal(f), "interview");
          else if (kind === 2) naPair(cellOf(v, f.k), side);
          want.push({ key:f.k, side:side });
        });
      }
    });
    /* 区分は欄の中身から独立に読み直す（値あり／not_measured／na のどれであるか） */
    function stateOf(vuc, w){
      var c = cellOf(vuc, w.key);
      if (!c) return "欄が無い";
      var b = w.side ? (c.blank ? c.blank[w.side] : undefined) : c.blank;
      var raw = w.side ? c[w.side] : c.v;
      var kind = (b === "na") ? "na"
               : (b === "not_measured") ? "not_measured"
               : (!b && raw !== null && raw !== undefined && raw !== "") ? "値あり" : "どれでもない";
      return [w.key, w.side, kind, JSON.stringify(raw === undefined ? null : raw),
              w.side ? String(c.unit) : ""].join("|");
    }
    var before = want.map(function(w){ return stateOf(v, w); });
    var keep = S.data, text;
    try { S.data = d; text = serialize(); } finally { S.data = keep; }
    var mig = migrate(JSON.parse(text));
    var v2 = (mig.data && mig.data.vucs) ? mig.data.vucs[0] : null;
    var after = v2 ? want.map(function(w){ return stateOf(v2, w); }) : [];
    var same = after.length === before.length && before.every(function(s, i){ return s === after[i]; });
    /* 3区分が本当に混ざっていること（混ざっていなければ、この検査は何も確かめていない） */
    var mixed = ["|値あり|","|not_measured|","|na|"].every(function(k){
      return before.some(function(s){ return s.indexOf(k) >= 0; });
    });
    ok("E3", mixed && same && mig.errors.length === 0,
       "書き出して読み直しても、値あり・not_measured・na のどれであるかが全欄で変わらない");
  })();

  /* E4 Kill済み・Pivot済みのIDは再利用されない */
  (function(){
    var d = tmpProject(), ids = {};
    for (var i = 0; i < 5; i++){
      var v = tmpVuc(d);
      if (ids[v.id]) { ok("E4", false, "IDが重複した：" + v.id); return; }
      ids[v.id] = true;
      v.closed = "killed";
      v.closure = { at:todayISO(), type:"killed", category:"no_payer", reason:"検査", successor:null };
    }
    ok("E4", true, "終了と新規作成を繰り返してもIDが重複しない（欠番は詰めない）");
  })();

  /* E5 後継VUCなしに Pivot を確定できない */
  (function(){
    var d = tmpProject(), v = tmpVuc(d);

  ok("Core9", CORE_SINGLE_FIELDS.length === 9, "記述粒度の判定対象は #4〜#7 の単一値9欄");

  /* Core-map 本書の Core 8欄（表7-2・図7-6）と台帳の欄の対応（大綱 付録C）が、実在する欄に解決すること。
     本書の8欄と台帳の9欄は、数が近いだけで同じ集合ではない。欄数を数える検査も、Core の数を数える検査も、
     この食い違いを素通りする。だから中身の側を見る。
     品質プロファイルだけは台帳に欄が無い（v1は欄グループ#8を実装しない）ので、この一覧に入れてはいけない。
     ここで確かめられるのは「対応表が指す欄が実在すること」までで、対応そのものの妥当性は人が読む */
  (function(){
    var mapped = ["fields.beneficiary","fields.payer","fields.workaround","fields.valueMetric",
                  "fields.wtp","fields.wtpEvidence","fields.mainRisk",
                  "economics.K","economics.P","economics.Q","economics.c","economics.U",
                  "gate4.unitEconomics"];
    var gone = mapped.filter(function(k){ return !FIELD_BY_KEY[k]; });
    var riskInCore = CORE_SINGLE_FIELDS.indexOf("fields.mainRisk") >= 0;
    ok("Core-map", gone.length === 0 && riskInCore,
       gone.length ? "本書のCore8欄との対応表が、付録Cに無い欄を指している：" + gone.join("／")
       : !riskInCore ? "主リスクが記述粒度の判定対象（#4〜#7 の単一値欄）に入っていない"
       : "本書のCore8欄に対応づけた " + mapped.length + "欄がすべて付録Cに解決し、主リスクが記述粒度の判定対象に入っている");
  })();

  /* Canon 正典章の参照が book-index の中で閉じていること。
     本書の章別HTMLとの突き合わせ（章題・節題が本書と一致するか）はブラウザからは読めないので
     check_book_refs.js が担当する。ここで見るのは「指した先が索引に在るか」「死んだ索引が無いか」 */
  (function(){
    var missing = [], usedCh = {}, usedSec = {};
    /* 参照は2つの表から集める。付録Cの欄（canon）と、欄ごとの手法表（FIELD_METHODS）。
       片方だけを見ると、手法のために足した節が「参照されない索引」に見えて Canon-dead が誤検知する */
    var refs = [];
    FIELDS.forEach(function(f){ if (f.canon) refs.push({ canon:f.canon, who:f.k }); });
    Object.keys(FIELD_METHODS).forEach(function(k){
      FIELD_METHODS[k].forEach(function(x){
        if (x.canon) refs.push({ canon:x.canon, who:k + "／" + x.m });
      });
    });
    /* プロンプトが指す章・節も同じ索引で閉じること。ここを入れ忘れると、
       プロンプトのためだけに足した節が「参照されない索引」に見えて Canon-dead が誤検知する */
    Object.keys(FIELD_PROMPTS).forEach(function(k){
      FIELD_PROMPTS[k].forEach(function(x){
        if (x.canon) refs.push({ canon:x.canon, who:k + "／" + x.u });
      });
    });
    refs.forEach(function(r){
      var p = String(r.canon).split("#"), ch = BOOK.chapters[p[0]];
      usedCh[p[0]] = true;
      if (!ch){ missing.push(r.canon + "（" + r.who + "）"); return; }
      if (p[1]){
        usedSec[p[0] + "#" + p[1]] = true;
        if (!(ch.sections || {})[p[1]]) missing.push(r.canon + "（" + r.who + "）");
      }
    });
    /* 手法表の欄キーが付録Cに無いと、その欄のヘルプに手法が出ないまま黙って通る（silent failure） */
    var badMK = Object.keys(FIELD_METHODS).filter(function(k){ return !FIELD_BY_KEY[k]; });
    ok("Methods-keys", badMK.length === 0,
       badMK.length ? "手法表に、付録Cに無い欄キーがある：" + badMK.join("／")
                    : "手法表の欄キー " + Object.keys(FIELD_METHODS).length + "件が、すべて付録Cの欄に解決する");
    /* プロンプト表の欄キーが付録Cに無いと、その欄のヘルプにプロンプトが出ないまま黙って通る */
    var badPK = Object.keys(FIELD_PROMPTS).filter(function(k){ return !FIELD_BY_KEY[k]; });
    ok("Prompt-keys", badPK.length === 0,
       badPK.length ? "プロンプト表に、付録Cに無い欄キーがある：" + badPK.join("／")
                    : "プロンプト表の欄キー " + Object.keys(FIELD_PROMPTS).length + "件が、すべて付録Cの欄に解決する");
    /* 人が書く欄は、視点の違うプロンプトを2件以上持つこと。
       自動で入る欄（AUTO_FILLED_FIELDS）と派生欄は対象外 */
    var needP = FIELDS.filter(function(f){
      return f.t !== "derived" && AUTO_FILLED_FIELDS.indexOf(f.k) < 0;
    });
    var thinP = needP.filter(function(f){ return (FIELD_PROMPTS[f.k] || []).length < 2; });
    var autoP = Object.keys(FIELD_PROMPTS).filter(function(k){
      var f = FIELD_BY_KEY[k];
      return f && (f.t === "derived" || AUTO_FILLED_FIELDS.indexOf(k) >= 0);
    });
    /* プロンプトが台帳の選択肢を並べるなら、実際のラベルのとおりに全部並べること。
       食い違っていると、AIは台帳で選べない分類を返し、人はそれを入れられない。
       画面は何も言わずに描けてしまうので、ここで見ないと通る（silent failure）。
       実測: やめた理由のプロンプトが「採算が合わなかった／致命リスク／他を優先」と書き、
       6分類のうち3つが選択肢に無い語、1つが丸ごと欠けていた。
       「AI下書き」だけは例外。AIに「AI下書きを作れ」と指示することはないため */
    var ENUM_LISTS = [
      { name:"やめた理由の分類", labs:CLOSURE_CATEGORIES.map(function(c){ return c.label; }), skip:[] },
      { name:"出所の種別",       labs:SOURCE_TYPES.map(function(c){ return c.label; }), skip:["AI下書き"] },
      { name:"トレース行の状態", labs:TRACE_STATUS.map(function(c){ return c.label; }), skip:[] }
    ];
    var qList = [];
    Object.keys(FIELD_PROMPTS).forEach(function(k){
      FIELD_PROMPTS[k].forEach(function(p){ qList.push({ k:k, q:p.q }); });
    });
    var enumBad = [];
    ENUM_LISTS.forEach(function(e){
      var core = e.labs.map(function(l){ return l.replace(/（[^）]*）/g, "").trim(); });
      var need = core.filter(function(c){ return e.skip.indexOf(c) < 0; });
      qList.forEach(function(x){
        var hit = need.filter(function(c){ return x.q.indexOf(c) >= 0; });
        if (hit.length < 2) return;
        var miss = need.filter(function(c){ return x.q.indexOf(c) < 0; });
        if (miss.length) enumBad.push(x.k + "：" + e.name + " の「" + miss.join("／") + "」が抜けている");
      });
    });
    ok("Prompt-enum", enumBad.length === 0,
       enumBad.length ? "プロンプトの選択肢が台帳と食い違う：" + enumBad.join("／")
                      : "選択肢を並べるプロンプトは、台帳のラベルのとおりに全部並べている");

    /* 確かめ方の表が、出所の5値と付録Cの欄の両方で閉じていること。
       ここが開いていると、? に手段が出ないまま黙って通る（silent failure） */
    var badWS = VERIFY_WAYS.filter(function(w){
      return SOURCE_TYPES.filter(function(s){ return s.k === w.src; }).length === 0;
    }).map(function(w){ return w.k; });
    ok("Ways-src", badWS.length === 0,
       badWS.length ? "確かめ方が、付録の出所5値に無い出所を指している：" + badWS.join("／")
                    : "確かめ方 " + VERIFY_WAYS.length + "件の出所が、すべて本書6.2.1の5値に解決する");
    var badWK = Object.keys(FIELD_WAYS).filter(function(k){ return !FIELD_BY_KEY[k]; });
    var badWR = [];
    Object.keys(FIELD_WAYS).forEach(function(k){
      FIELD_WAYS[k].w.forEach(function(x){ if (!WAY_BY_KEY[x]) badWR.push(k + "／" + x); });
    });
    ok("Ways-keys", badWK.length === 0 && badWR.length === 0,
       badWK.length ? "確かめ方の表に、付録Cに無い欄キーがある：" + badWK.join("／")
       : badWR.length ? "確かめ方の表が、一覧に無い手段を指している：" + badWR.join("／")
       : "確かめ方の表 " + Object.keys(FIELD_WAYS).length + "欄が、付録Cの欄と手段一覧の両方に解決する");
    /* 出所が付く欄（cell:true）は、どう確かめるかが必ず要る。
       出所を選ばせておいて「どうやって出所を作るか」を書かないのは、欄の設計として穴 */
    var thinW = CELL_FIELDS.filter(function(f){
      var fw = FIELD_WAYS[f.k];
      return !fw || !fw.w.length || !fw.note;
    }).map(function(f){ return f.k; });
    ok("Ways-cover", thinW.length === 0,
       thinW.length ? "出所が付くのに確かめ方が無い欄：" + thinW.join("／")
                    : "出所が付く " + CELL_FIELDS.length + "欄すべてに、確かめ方とその欄固有のつまずきがある");

    ok("Prompt-cover", thinP.length === 0 && autoP.length === 0,
       thinP.length ? "プロンプトが2件に満たない欄：" + thinP.map(function(f){ return f.k; }).join("／")
       : autoP.length ? "自動で入る欄にプロンプトが付いている：" + autoP.join("／")
       : "人が書く " + needP.length + "欄すべてに、視点の違うプロンプトが2件以上ある");
    ok("Canon-in", missing.length === 0,
       missing.length ? "索引に無い章・節を指している：" + missing.join("／")
                      : "すべての正典章が book-index の章と節に解決する");
    var dead = [];
    Object.keys(BOOK.chapters).forEach(function(k){
      if (!usedCh[k]) dead.push("第" + BOOK.chapters[k].no + "章");
      var secs = BOOK.chapters[k].sections || {};
      Object.keys(secs).forEach(function(s){ if (!usedSec[k + "#" + s]) dead.push(String(s).replace("-", ".")); });
    });
    /* 書いた値が保存で消えないこと。
       「この欄の状態」の既定が「まだ測っていない」のまま保存すると、入力が黙って捨てられ、
       同じ欄が「今日の一手」に出続ける不具合を実測で踏んだ。状態が食い違っても値を捨てない */
    (function(){
      var realToast = toast, realTouch = touchProject;
      toast = function(){}; touchProject = function(){};
      try {
        var d = tmpProject(), v = tmpVuc(d);
        applyFieldEdit(v, FIELD_BY_KEY["fields.painCost"],
          { kind:"pair", side:"expected", v:"8000000", unit:"円/年", blank:"not_measured", src:"interview" });
        var pc = cellOf(v, "fields.painCost");
        applyFieldEdit(v, FIELD_BY_KEY["fields.customer"],
          { kind:"single", v:"購買部の発注担当", blank:"not_measured", src:"interview" });
        var sc = cellOf(v, "fields.customer");
        applyFieldEdit(v, FIELD_BY_KEY["fields.beneficiary"],
          { kind:"single", v:"消されるはず", blank:"na", src:"" });
        var nc = cellOf(v, "fields.beneficiary");
        applyFieldEdit(v, FIELD_BY_KEY["fields.payer"],
          { kind:"single", v:"", blank:"not_measured", src:"" });
        var ec = cellOf(v, "fields.payer");
        var bad = [];
        if (!(pc.expected === 8000000 && pc.blank.expected === null)) bad.push("期待実測の値が消えた");
        if (!(sc.v === "購買部の発注担当" && sc.blank === null)) bad.push("単一値の値が消えた");
        if (!(nc.v === null && nc.blank === "na")) bad.push("該当なしが値を消していない");
        if (!(ec.v === null && ec.blank === "not_measured")) bad.push("空の保存が未測定にならない");
        ok("Edit-keep", bad.length === 0,
           bad.length ? bad.join("／")
                      : "「この欄の状態」が食い違っていても、書いた値を捨てない（該当なしのときだけ消す）");
      } finally { toast = realToast; touchProject = realTouch; }
    })();

    /* ヘルプを重ねても、下の面と書きかけの入力が消えないこと。
       ? が編集面を上書きしていたころは、開き直すまで入力が黙って失われていた。
       面そのものを作って確かめる（台帳のデータには触らない） */
    (function(){
      var ov = document.getElementById("overlay"), sh = document.getElementById("sheet");
      var wasOpen = !ov.hidden;
      /* 焦点は先頭以外の欄に置く。先頭に置くと、戻り先を取り違えていても
         「先頭へ焦点」の既定と結果が同じになり、検査が素通りする */
      var head = el("input", { type:"text" });
      var probe = el("input", { type:"text" });
      showSheet("検査用の面", [head, probe], []);
      probe.value = "書きかけ";
      probe.focus();
      showHelp("field:fields.payer");
      var onTop = document.getElementById("ovTitle").textContent === "支払者・予算責任者";
      var gone = !sh.contains(probe);
      closeSheet();
      var back = sh.contains(probe) && probe.value === "書きかけ";
      var refocus = document.activeElement === probe;
      closeSheet();
      var shut = ov.hidden && sheetStack.length === 0;
      sheetStack = []; sh.innerHTML = ""; ov.hidden = true;
      var all = onTop && gone && back && refocus && shut && !wasOpen;
      ok("Sheet-stack", all,
         all ? "ヘルプは編集面の上に重なり、閉じると書きかけの入力と焦点ごと下の面へ戻る"
             : "重ねた面が戻らない：" + [onTop ? "" : "ヘルプが上に出ない",
                 gone ? "" : "下の面が退避されていない", back ? "" : "閉じても入力が戻らない",
                 refocus ? "" : "閉じても焦点が元の位置に戻らない",
                 shut ? "" : "2回閉じても面が残る", wasOpen ? "検査の前から面が開いていた" : ""]
                 .filter(function(x){ return x; }).join("／"));
    })();

    /* 飛ばしても行き止まりにならないこと。連打すると同じ案件の一手を1件ずつ回り、
       ひと回りしたら先頭へ戻る（6.7.1）。飛ばした記録は台帳に書かないので、
       開き直せばまた最上位から出る。「同じ件が二度出ない」と「戻ってくる」を両方数える */
    (function(){
      var realToast = toast, realTouch = touchProject, savedSkip = S.skipped;
      toast = function(){}; touchProject = function(){};
      try {
        S.skipped = {};
        var d = tmpProject(), v = tmpVuc(d), T3 = st();
        addUnmetEvidence(v, "検査用のメモ1", null);
        addUnmetEvidence(v, "検査用のメモ2", null);
        var mine = nextActions(v, T3), bad = [], seen = [], i, p;
        if (mine.length < 3){
          ok("Skip-cycle", false, "検査用のVUCに一手が3件そろわない（" + mine.length + "件）");
        } else {
          for (i = 0; i <= mine.length; i++){
            p = pickAction(v.id, mine);
            if (!p.rec){ bad.push((i + 1) + "回目で一手が出なくなった"); break; }
            if (p.index !== (i % mine.length) + 1)
              bad.push((i + 1) + "回目の件数表示が " + p.index + "件目");
            seen.push(actionKey(p.rec));
            markSkipped(v.id, p.rec);
          }
          var uniq = {};
          seen.slice(0, mine.length).forEach(function(k){ uniq[k] = true; });
          if (Object.keys(uniq).length !== mine.length)
            bad.push("ひと回りの間に同じ一手が二度出た（" + mine.length + "件中 " + Object.keys(uniq).length + "種）");
          if (seen.length <= mine.length) bad.push("ひと回りの先を見ていない");
          else if (seen[mine.length] !== seen[0]) bad.push("ひと回りしたあと先頭へ戻らない");
          if ((v.log || []).some(function(l){ return l.key === "skip" || l.type === "skip"; }))
            bad.push("飛ばしたことを台帳に書いている");
          ok("Skip-cycle", bad.length === 0,
             bad.length ? bad.join("／")
                        : "一手 " + mine.length + "件を飛ばし切ると先頭へ戻り、その間に同じ件は二度出ない（台帳には書かない）");
        }
      } finally { S.skipped = savedSkip; toast = realToast; touchProject = realTouch; }
    })();

    /* 航海図のチップは、押すと航海日誌の該当行へ飛ぶ。行が無ければ飛び先が無い。
       「出るべきものが出ているか」は不正の検査では映らないので、対応そのものを数える */
    (function(){
      var miss = [], T2 = st();
      if (!(S.data.vucs || []).length){
        ok("Log-rows", true, "VUCが無いので対応は検査しない（1本でも作ると検査する）");
        return;
      }
      var focus = findVuc(S.focusVuc) || S.data.vucs[0];
      try { renderLog(); } catch (e){ miss.push("航海日誌が描けない：" + e.message); }
      VOYAGE.forEach(function(L){
        legStations(focus, L.k, T2).fields.forEach(function(f){
          if (!document.getElementById(logRowId(L.k, f.key))) miss.push(L.k + "／" + f.label);
        });
      });
      ok("Log-rows", miss.length === 0,
         miss.length ? "航海図から飛ぶ先が航海日誌に無い：" + miss.slice(0, 4).join("／")
                     : "航海図のチップは、すべて航海日誌の行に対応している");
    })();

    /* 図の文字が、枠からはみ出していないか・重なっていないか。
       幅はフォントで変わるので、実際に描いて測るしかない（静的な字数計算では分からない）。
       画面外に置いて測り、すぐ捨てる */
    var figBad = [];
    (function(){
      var host = el("div", { style:"position:absolute;left:-10000px;top:0;width:900px" });
      document.body.appendChild(host);
      try {
        ALL_FIGS.forEach(function(make){
          var f; try { f = make(); } catch (e){ figBad.push("描けない：" + e.message); return; }
          host.appendChild(f);
          var svg = f.querySelector("svg"), vb = svg.getAttribute("viewBox").split(" ").map(Number);
          var name = svg.getAttribute("aria-label") || "図";
          var bb = svg.getBBox();
          if (bb.x < -1 || bb.y < -1 || bb.x + bb.width > vb[2] + 1 || bb.y + bb.height > vb[3] + 1)
            figBad.push(name + "：中身が枠をはみ出している");
          var rects = Array.prototype.map.call(svg.querySelectorAll("rect"), function(r){
            return { x:+r.getAttribute("x"), y:+r.getAttribute("y"),
                     w:+r.getAttribute("width"), h:+r.getAttribute("height") };
          });
          var texts = Array.prototype.map.call(svg.querySelectorAll("text"), function(t){
            var b = t.getBBox();
            return { s:t.textContent, x:b.x, y:b.y, w:b.width, h:b.height,
                     ax:+t.getAttribute("x"), ay:+t.getAttribute("y") };
          });
          texts.forEach(function(t){
            if (t.x < -1 || t.x + t.w > vb[2] + 1) figBad.push(name + "：「" + t.s + "」が図の外へ出る");
            var host2 = rects.filter(function(r){
              return t.ax >= r.x && t.ax <= r.x + r.w && t.ay >= r.y - 4 && t.ay <= r.y + r.h + 4;
            }).sort(function(p, q){ return p.w * p.h - q.w * q.h; })[0];
            if (host2 && (t.x < host2.x - 1 || t.x + t.w > host2.x + host2.w + 1))
              figBad.push(name + "：「" + t.s + "」が枠からはみ出す");
          });
          for (var i = 0; i < texts.length; i++) for (var j = i + 1; j < texts.length; j++){
            var a = texts[i], b2 = texts[j];
            if (Math.min(a.x + a.w, b2.x + b2.w) - Math.max(a.x, b2.x) > 2 &&
                Math.min(a.y + a.h, b2.y + b2.h) - Math.max(a.y, b2.y) > 2)
              figBad.push(name + "：「" + a.s + "」と「" + b2.s + "」が重なる");
          }
        });
      } finally { document.body.removeChild(host); }
    })();
    /* 一覧に載せ忘れた図は測られない。使い方タブが実際に出す枚数と突き合わせる */
    (function(){
      var shown = -1;
      try { renderTutorial(); shown = document.querySelectorAll("#screen-tutorial figure.fig").length; }
      catch (e){ shown = -1; }
      ok("Fig-all", shown === ALL_FIGS.length,
         shown === ALL_FIGS.length ? "使い方タブが出す図 " + shown + "枚が、すべて検査の一覧に載っている"
                                   : "使い方タブは " + shown + "枚出すのに、検査の一覧は " + ALL_FIGS.length + "枚");
    })();
    ok("Fig-fit", figBad.length === 0,
       figBad.length ? figBad.slice(0, 4).join("／") + (figBad.length > 4 ? "／ほか " + (figBad.length - 4) + "件" : "")
                     : "使い方タブの図 " + ALL_FIGS.length + "枚で、文字のはみ出しと重なりが無い");

    /* 手順が指す章も索引に在ること。無いと描画側が黙って飛ばすので、ここで除く */
    var tutBad = [];
    TUTORIAL_STEPS.forEach(function(s){
      s.canon.forEach(function(k){ if (!BOOK.chapters[k]) tutBad.push(s.t + "→" + k); });
    });
    ok("Tut-ch", tutBad.length === 0,
       tutBad.length ? "使い方の手順が索引に無い章を指している：" + tutBad.join("／")
                     : "使い方の手順が指す章が、すべて book-index にある");
    ok("Canon-dead", dead.length === 0,

function tutorialChapterMap(){
  var wiz = {};
  WIZ1.forEach(function(q){ wiz[String(q.key).split(".expected")[0]] = "VUCを作る（第1段）"; });
  WIZ2.forEach(function(q){ wiz[String(q.key).split(".expected")[0]] = "VUCを作る（第2段）"; });
  var byCh = {}, order = [];
  FIELDS.forEach(function(f){
    if (!f.canon) return;
    var key = String(f.canon).split("#")[0];
    if (!BOOK.chapters[key]) return;
    if (!byCh[key]){ byCh[key] = { key:key, ch:BOOK.chapters[key], labels:[], places:[], secs:[] }; order.push(key); }
    var e = byCh[key], sec = String(f.canon).split("#")[1];
    if (e.labels.indexOf(f.label) < 0) e.labels.push(f.label);
    if (sec && e.secs.indexOf(sec) < 0) e.secs.push(sec);
    var place = f.t === "derived" ? "自動で計算される" : (wiz[f.k] || "測る・判定する");
    if (e.places.indexOf(place) < 0) e.places.push(place);
  });
  return order.map(function(k){ return byCh[k]; })
              .sort(function(a, b){ return a.ch.no - b.ch.no; });
}

/* =========================================================================
   図の部品。SVGは DOM API で組む（テンプレート文字列にしない＝ el() と同じ作法）。
   色はCSSの class に任せ、属性で色を直書きしない（テーマ切替で読めなくなるため）
   ========================================================================= */
const SVGNS = "http://www.w3.org/2000/svg";
function sv(tag, attrs, kids){
  var n = document.createElementNS(SVGNS, tag);
  if (attrs) Object.keys(attrs).forEach(function(k){
    if (k === "text") n.textContent = attrs[k];
    else if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
  });
  (kids||[]).forEach(function(c){ if (c) n.appendChild(c); });
  return n;
}
/* 角丸の箱 */
function fbox(x, y, w, h, cls){
  return sv("rect", { x:x, y:y, width:w, height:h, rx:6, class:"fbox" + (cls ? " " + cls : "") });
}
/* 複数行のテキスト。行の高さは 15px 固定。anchor は middle 既定 */
function ftext(x, y, lines, cls, anchor){
  var g = sv("g", {});
  (typeof lines === "string" ? [lines] : lines).forEach(function(s, i){
    g.appendChild(sv("text", { x:x, y:y + i * 15, class:"ft" + (cls ? " " + cls : ""),
                               "text-anchor": anchor || "middle", text:s }));
  });
  return g;
}
/* 矢印。笠は線と同じ色（class を揃える）。dir は "r" "l" "d" "u" */
function farrow(x1, y1, x2, y2, cls, dir){
  var c = cls ? " " + cls : "", d = dir || (Math.abs(x2 - x1) >= Math.abs(y2 - y1) ? (x2 >= x1 ? "r" : "l") : (y2 >= y1 ? "d" : "u"));
  var hs = 5, head;
  if (d === "r") head = (x2 - hs) + "," + (y2 - hs) + " " + x2 + "," + y2 + " " + (x2 - hs) + "," + (y2 + hs);
  else if (d === "l") head = (x2 + hs) + "," + (y2 - hs) + " " + x2 + "," + y2 + " " + (x2 + hs) + "," + (y2 + hs);
  else if (d === "d") head = (x2 - hs) + "," + (y2 - hs) + " " + x2 + "," + y2 + " " + (x2 + hs) + "," + (y2 - hs);
  else head = (x2 - hs) + "," + (y2 + hs) + " " + x2 + "," + y2 + " " + (x2 + hs) + "," + (y2 + hs);
  return sv("g", {}, [
    sv("line", { x1:x1, y1:y1, x2:x2, y2:y2, class:"fline" + c }),
    sv("polygon", { points:head, class:"fhead" + c })
  ]);
}
/* 折れ線の矢印（縦→横→縦） */
function felbow(pts, cls, dir){
  var c = cls ? " " + cls : "", d = "M" + pts.map(function(p){ return p[0] + " " + p[1]; }).join(" L ");
  var a = pts[pts.length - 2], b = pts[pts.length - 1];
  return sv("g", {}, [
    sv("path", { d:d, class:"fline" + c }),
    farrow(a[0], a[1], b[0], b[1], cls, dir).childNodes[1]
  ]);
}
/* 図の枠。title は figure の見出し、caption は図の下の説明 */
function fig(w, h, kids, caption, label){
  var s = sv("svg", { viewBox:"0 0 " + w + " " + h, role:"img", "aria-label":label || caption || "図" }, kids);
  var f = el("figure", { class:"fig" });
  f.appendChild(s);
  if (caption) f.appendChild(el("figcaption", { text:caption }));
  return f;
}

/* 日本語をだいたいの字数で折る（SVGには自動折返しが無いため） */
function wrapJa(s, n){
  var out = [], t = String(s);
  while (t.length > n){ out.push(t.slice(0, n)); t = t.slice(n); }
  if (t) out.push(t);
  return out;
}
function clip(s, n){ return String(s).length > n ? String(s).slice(0, n - 1) + "…" : String(s); }

/* その章のうち、台帳が実際に指している節だけを並べる（節の題は book-index から） */
function sectionList(e){
  var box = el("div", { class:"small muted", style:"margin-top:4px" });
  e.secs.slice().sort(function(a, b){
    return Number(String(a).split("-")[1]) - Number(String(b).split("-")[1]);
  }).forEach(function(s){
    var t = (e.ch.sections || {})[s];
    box.appendChild(el("div", { text:String(s).replace("-", ".") + (t ? "　" + t : "") }));
  });
  return box;
}

    + "全欄を並べた画面は用意していません。ここに出ていない章（手法の選び方や設計の詳細）は、台帳の欄には対応しません。" }));
  root.appendChild(c5);

  /* 6. つまずきやすいところ */
  var c6 = el("div", { class:"card" }, [ el("h2", { text:"つまずきやすいところ" }) ]);
  [["欄を全部埋めたのに、段が L0 のままになる",
    "段が上がるのは、［測る・判定する］のいちばん下で［L◯へ上げる］を押したときだけです。宣言するのは人で、押す場所はそこ1箇所です。"],
   ["空欄のままにしてよいのか分からない",
    "構いません。空欄には「まだ測っていない」と「該当なし（測った結果の対象外）」の区別があり、該当なしは充足として数えます。飛ばした欄は［今日の一手］として戻ってきます。"],
   ["「今日の一手」が、いまの段と関係ない件を出す",
    "期限の超過と、止めている理由、採算、ゲート…という固定の順序で選んでいるためです。点数や乱数は使っていません。並びの理由は、その一手の脇に出ています。"
    + "これは効きの順で、やる順番ではありません。先に別の欄を書きたいときは［この一手は飛ばす］を押すと、同じ案件の次の1件に移ります。ひと回りすると先頭へ戻ります。"],
   ["書いたものが消えないか不安になる",
    "ブラウザへの自動保存は下書きです。キャッシュを消すと消えます。正本は［一覧と保存］から書き出すJSONのほうです。移すときもJSONで移します。"],
   ["ダブルクリックで開いたのに、別のフォルダの台帳が出てくる",
    "ブラウザが file:// をまとめて1つの格納域として扱うためです。分けたいときは、JSONをそれぞれ別に保存してください。"]
  ].forEach(function(r){
    c6.appendChild(el("h3", { text:r[0] }));
    c6.appendChild(el("p", { class:"small", text:r[1] }));
  });
  c6.appendChild(el("p", { class:"row", style:"margin-top:14px" }, [
    el("button", { class:"btn primary", type:"button", text:"今日の一手へ戻る",
                   onclick:function(){ go("today"); } }),
    el("button", { class:"btn", type:"button", text:"案を1本作る",
                   onclick:function(){ startWizard(); } })
  ]));
  root.appendChild(c6);
}

/* =========================================================================
   画面の切り替えと起動
   ========================================================================= */
function go(screen){
  S.screen = screen;
  SCREEN_KEYS.forEach(function(s){
    document.getElementById("screen-" + s).hidden = (s !== screen);
  });
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function(b){
    b.setAttribute("aria-current", b.dataset.screen === screen ? "true" : "false");
  });
  if (screen !== "today") S.justCreatedFirst = false;
  renderAll();
}
function renderAll(){
  if (!S.data) return;
  document.title = APP.name + (S.data.project.name ? "：" + S.data.project.name : "");
  renderSaveBar();
  renderProjectSelector();
  renderVoyage();
  if (S.screen === "today") renderToday();
  else if (S.screen === "create") renderCreate();
  else if (S.screen === "measure") renderMeasure();
  else if (S.screen === "log") renderLog();
  else if (S.screen === "settings") renderSettingsScreen();
  else if (S.screen === "tutorial") renderTutorial();
}
function renderProjectSelector(){
  var sel = document.getElementById("projSel");
  var list = lsGet("recent", []);
  sel.innerHTML = "";
  var seen = {};
  list.concat([{ id:S.data.project.id, name:S.data.project.name }]).forEach(function(p){
    if (seen[p.id]) return;
    seen[p.id] = true;
    sel.appendChild(el("option", { value:p.id, text:p.name }));
  });
  sel.value = S.data.project.id;
}
document.getElementById("projSel").addEventListener("change", function(e){
  var id = e.target.value;
  if (id === S.data.project.id) return;
  function open(){
    var d = lsGet("autosave." + id, null);
    if (!d){ toast("この端末に、そのプロジェクトの下書きが残っていません。JSONを読み込んでください", "warn"); renderAll(); return; }
    var m = migrate(d);
    if (m.data) adoptProject(m.data); else toast(m.errors.join("\n"), "bad");
  }
  if (S.dirty){
    showSheet("切り替える前に保存しますか", [
      el("p", { class:"note", text:"未保存の変更が " + S.dirtyCount + "件あります" })
    ], [
      el("button", { class:"btn primary", type:"button", text:"保存してから切り替える",
        onclick:function(){ save().then(function(){ closeSheet(); open(); }); } }),
      el("button", { class:"btn", type:"button", text:"保存せずに切り替える",
        onclick:function(){ closeSheet(); open(); } })
    ]);
    document.getElementById("projSel").value = S.data.project.id;
  } else open();
});
document.getElementById("btnNewProj").addEventListener("click", function(){
  var name = prompt("新しいプロジェクトの名前");
  if (!name) return;
  adoptProject(newProject(name));
  go("today");
});
document.getElementById("btnOpen").addEventListener("click", openFileDialog);
document.getElementById("btnTheme").addEventListener("click", function(){
  var cur = lsGet("theme", "auto");
  var next = cur === "auto" ? "light" : (cur === "light" ? "dark" : "auto");
  lsSet("theme", next); applyTheme();
  toast("テーマ：" + (next === "auto" ? "端末に合わせる" : next === "light" ? "ライト" : "ダーク"));
});
function applyTheme(){
  var t = lsGet("theme", "auto");
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
}
Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function(b){
  b.addEventListener("click", function(){ go(b.dataset.screen); });
});
window.addEventListener("beforeunload", function(e){
  lsSet(lastSeenKey(), nowISO());
  if (S.dirty){ e.preventDefault(); e.returnValue = ""; return ""; }
});

(function init(){
  /* 印刷用の器と、印刷だけに適用されるCSS（単一ファイルのまま持つ） */
  var st2 = document.createElement("style");
  st2.textContent = "#printArea{display:none}"
    + "@media print{ body.printing > main{display:none} body.printing #printArea{display:block} }";
  document.head.appendChild(st2);
  var area = document.createElement("div");
  area.id = "printArea";
  document.body.appendChild(area);

  applyTheme();
  document.getElementById("brand").textContent = APP.name;

  /* ヘッダとタブに ? を付ける（画面から作られるものは各 render で付ける） */
  [["projSel","project.select"], ["btnNewProj","project.new"],
   ["btnOpen","project.open"], ["btnTheme","theme"]].forEach(function(p){
    var e = document.getElementById(p[0]);
    if (!e) return;
    var wrap = el("span", { class:"tabwrap" });       /* ? がどれの説明かを見た目で結びつける */
    e.parentNode.insertBefore(wrap, e);
    wrap.appendChild(e);
    wrap.appendChild(helpBtn(p[1]));
  });
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function(b){
    var wrap = el("span", { class:"tabwrap" });
    b.parentNode.insertBefore(wrap, b);
    wrap.appendChild(b);
    wrap.appendChild(helpBtn("nav." + b.dataset.screen));
  });

  var recent = lsGet("recent", []);
  var data = recent.length ? lsGet("autosave." + recent[0].id, null) : null;
  if (data){
    var m = migrate(data);
    if (m.data){ S.data = m.data; normalizeSeq(); }
  }
  if (!S.data) S.data = newProject("新しいプロジェクト");

  /* 上書きモードなら、前回のファイルハンドルを取り戻す（権限は最初の保存のときだけ聞く） */
  if (S.mode === "overwrite"){
    idbGet("handle." + S.data.project.id).then(function(h){
      if (h){ S.handle = h; S.handleName = h.name; renderSaveBar(); }
    });
  }
  var dup = checkIdUniqueness(S.data);
  if (dup.length) toast("IDが重複しています：" + dup.join("・") + "（V6）", "bad");
  if (S.data.bookRevision && S.data.bookRevision !== APP.bookRevision)
    toast("本書の版が違います（このデータ：" + S.data.bookRevision + " ／ ツール内蔵：" + APP.bookRevision + "）", "warn");
  if (!lsOK) toast("この環境ではブラウザ保存が使えません。作業を残すには毎回JSONを保存してください", "warn");

  go("today");
})();
</script>
</body>
