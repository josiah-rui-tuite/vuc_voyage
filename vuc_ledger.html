<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waypoint</title>
<style>
/* ===== テーマ（ライト・ダーク両対応。コントラスト比は付録F.2の目標に合わせる） ===== */
:root{
  --bg:#ffffff; --panel:#f5f6f8; --panel2:#eceef2; --line:#c9ced8;
  --fg:#16191f; --fg2:#4a5160; --accent:#1c4fd8; --accent-fg:#ffffff;
  --warn:#8a4b00; --warn-bg:#fff3e0; --bad:#a11212; --bad-bg:#fdecec;
  --ok:#0f6b3c; --ok-bg:#e8f5ec; --muted:#6a7180;
  --radius:6px; --mono:"SFMono-Regular",Consolas,"Courier New",monospace;
}
:root[data-theme="dark"]{
  --bg:#14161b; --panel:#1c1f26; --panel2:#242832; --line:#3a4050;
  --fg:#eef1f6; --fg2:#b9c0cd; --accent:#7ba4ff; --accent-fg:#0d1016;
  --warn:#ffc46b; --warn-bg:#3a2c12; --bad:#ff9b9b; --bad-bg:#3a1a1a;
  --ok:#7fd8a4; --ok-bg:#14301f; --muted:#8c94a4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161b; --panel:#1c1f26; --panel2:#242832; --line:#3a4050;
    --fg:#eef1f6; --fg2:#b9c0cd; --accent:#7ba4ff; --accent-fg:#0d1016;
    --warn:#ffc46b; --warn-bg:#3a2c12; --bad:#ff9b9b; --bad-bg:#3a1a1a;
    --ok:#7fd8a4; --ok-bg:#14301f; --muted:#8c94a4;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg); font-size:15px; line-height:1.7;
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic Medium","Meiryo",system-ui,sans-serif;
}
h1,h2,h3{line-height:1.4;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

/* ===== ヘッダ ===== */
.hd{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}
.hd-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:8px 16px;max-width:1000px;margin:0 auto}
.brand{font-weight:700;letter-spacing:.04em}
.hd select,.hd input{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:var(--radius);padding:4px 8px}
.savebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--fg2);
  padding:6px 16px;max-width:1000px;margin:0 auto;border-top:1px solid var(--line)}
.savebar .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.savebar.dirty .dot{background:var(--warn)}
.hint-line{font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:2px;padding:0 16px;max-width:1000px;margin:0 auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;color:var(--fg2)}
nav.tabs button[aria-current="true"]{border-bottom-color:var(--accent);color:var(--fg);font-weight:700}
.tabsub{display:block;font-size:11px;font-weight:400;color:var(--muted);letter-spacing:0}
.tabwrap{display:flex;align-items:center;gap:1px;margin-right:10px}
.tabwrap .help{align-self:center}

/* ===== 航海図（全体像と現在地） ===== */
.voyage{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin:0 0 14px}
.voyage h2{font-size:14px;color:var(--fg2);margin:0 0 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rail{display:flex;gap:0;align-items:stretch;overflow-x:auto;padding-bottom:4px}
.leg{flex:1 1 0;min-width:112px;border-top:4px solid var(--line);padding:8px 8px 0;position:relative}
.leg.done{border-top-color:var(--ok)}
.leg.here{border-top-color:var(--accent)}
.leg .lk{font-size:12px;font-weight:700;color:var(--muted)}
.leg.done .lk{color:var(--ok)}
.leg.here .lk{color:var(--accent)}
.leg .ln{font-size:13px;color:var(--fg2);line-height:1.5}
.leg.here .ln{color:var(--fg);font-weight:700}
.leg .lmark{position:absolute;top:-11px;left:8px;width:14px;height:14px;border-radius:50%;
  background:var(--bg);border:3px solid var(--line)}
.leg.done .lmark{border-color:var(--ok);background:var(--ok)}
.leg.here .lmark{border-color:var(--accent);background:var(--accent)}
.voyage .here-note{margin-top:10px;padding:8px 10px;border-left:3px solid var(--accent);background:var(--bg)}
/* 凡例：帯と丸の色が何を意味するか。色だけで区別させない（形と言葉も添える） */
.legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:2px 0 8px}
.legend .k{display:inline-flex;gap:5px;align-items:center}
.legend .sw{width:22px;height:4px;border-radius:2px;background:var(--line)}
.legend .sw.done{background:var(--ok)} .legend .sw.here{background:var(--accent)}
.legend .dot2{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);background:var(--bg)}
.legend .dot2.done{border-color:var(--ok);background:var(--ok)}
.legend .dot2.here{border-color:var(--accent);background:var(--accent)}
/* 詳しく見る：6区間を縦に伸ばし、各段に「要る事実」を全部並べる（帯は左端に立つ） */
.rail.detail{flex-direction:column;gap:0}
.rail.detail .leg{flex:1 1 auto;min-width:0;border-top:0;border-left:4px solid var(--line);
  padding:8px 10px 12px 14px;margin:0}
.rail.detail .leg.done{border-left-color:var(--ok)} .rail.detail .leg.here{border-left-color:var(--accent)}
.rail.detail .leg .lmark{top:10px;left:-9px}
.stations{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.station{display:inline-flex;gap:5px;align-items:center;font-size:12px;line-height:1.4;
  border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--fg2);background:var(--bg)}
.station .mk{font-weight:700}
.station.filled{border-color:var(--ok);color:var(--ok)}
.station.lack{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
.station.cond{border-style:dashed}
.station.warnchip{border-color:var(--warn);color:var(--warn)}
.station button{border:0;background:none;color:inherit;font:inherit;text-decoration:underline;cursor:pointer;padding:0}
/* 航海図から飛んできた行を、しばらく光らせる */
tr.hit td{background:var(--warn-bg)}

/* ===== 図（使い方タブ）。色はすべてトークンで指定する。テーマを変えても読めるようにするため、
   図の中で色を直書きしてはいけない。矢印の笠は線と同じ class を付けて同色にする ===== */
.fig{margin:12px 0 4px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--bg);padding:12px 14px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
/* 画面が狭いときは縮めずに横へスクロールさせる（縮めると図の中の字が読めなくなる） */
@media (max-width:760px){
  .fig{overflow-x:auto}
  .fig svg{width:700px;max-width:none}
}
.fig .fbox{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.fig .fbox.accent{stroke:var(--accent);stroke-width:2}
.fig .fbox.ok{stroke:var(--ok);stroke-width:2}
.fig .fbox.warn{stroke:var(--warn);stroke-width:2}
.fig .fbox.bad{stroke:var(--bad);stroke-width:2}
.fig .fbox.ghost{fill:none;stroke-dasharray:4 4}
.fig .fbox.plain{fill:var(--bg)}
.fig .ft{fill:var(--fg);font-size:13px;font-family:inherit}
.fig .ft.b{font-weight:700}
.fig .ft.sm{fill:var(--fg2);font-size:12px}
.fig .ft.mu{fill:var(--muted);font-size:11.5px}
.fig .ft.xs{fill:var(--muted);font-size:10.5px}
.fig .ft.ac{fill:var(--accent)} .fig .ft.ok{fill:var(--ok)}
.fig .ft.wa{fill:var(--warn)} .fig .ft.ba{fill:var(--bad)}
.fig .fline{stroke:var(--line);stroke-width:1.5;fill:none}
.fig .fline.accent{stroke:var(--accent)} .fig .fline.ok{stroke:var(--ok)}
.fig .fline.muted{stroke:var(--muted);stroke-dasharray:4 4}
.fig .fhead{fill:var(--line);stroke:none}
.fig .fhead.accent{fill:var(--accent)} .fig .fhead.ok{fill:var(--ok)}
.fig .fhead.muted{fill:var(--muted)}
.fig .fband{fill:var(--panel2);stroke:none}
.steps{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--fg2);margin-top:8px}
.steps span{border:1px solid var(--line);border-radius:999px;padding:1px 10px;background:var(--bg)}
.steps span.done{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.steps span.now{border-color:var(--accent);color:var(--accent);font-weight:700}

/* ===== ヘルプ（? ボタン） ===== */
.help{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;
  border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--fg2);
  font-size:12px;line-height:1;cursor:pointer;padding:0;margin-left:6px;vertical-align:middle;flex:none}
.help:hover{border-color:var(--accent);color:var(--accent)}
.helpsec{margin:10px 0}
.helpsec ul.plain li{padding:5px 0}
.helpsec .mname{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.helpsec h3{font-size:13px;color:var(--fg2);margin:0 0 2px}
.helpsec p{margin:0}
.helpex{font-family:var(--mono);font-size:13px;background:var(--panel2);border:1px solid var(--line);
  border-radius:var(--radius);padding:8px 10px;white-space:pre-wrap}
/* AIプロンプト。既定は畳む。畳んだ状態で見えるのは種別と用途の1行だけ */
.helpsec details.prm{border:1px solid var(--line);border-radius:var(--radius);
  background:var(--panel2);margin:6px 0;padding:0 10px}
.helpsec details.prm>summary{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;
  color:var(--fg);font-size:13px;padding:8px 0}
.helpsec details.prm[open]>summary{border-bottom:1px solid var(--line);margin-bottom:8px}
.prmtag{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;
  color:var(--fg2);background:var(--bg);flex:none}
.prmbody{margin:0 0 8px;background:var(--bg)}
.prmbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-bottom:10px}
.btn.mini{padding:4px 10px;font-size:12px}
/* 確かめ方。畳んだ行は手段名と出所だけ。開くと分かることと限界が出る */
.wayline{margin:0 0 6px;color:var(--fg2)}
.wayline:last-child{padding-bottom:10px}
.wayline strong{color:var(--fg)}
.waytable td:first-child{white-space:nowrap}

/* ===== レイアウト ===== */
main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:0 0 14px}
.card h2{font-size:15px;color:var(--fg2);font-weight:700;margin-bottom:8px}
/* 見出しの大きさは h2 を超えない。バッジを並べるので行として組む */
.card h3{font-size:14px;color:var(--fg);font-weight:700;margin:18px 0 6px;
  display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card h3:first-of-type{margin-top:8px}
.card table{margin:6px 0 4px}
.chmap td:nth-child(1),.chmap th:nth-child(1){width:15%}
.chmap td:nth-child(2),.chmap th:nth-child(2){width:20%}
.chmap td:nth-child(3),.chmap th:nth-child(3){width:17%}
@media (max-width:700px){.chmap td,.chmap th{width:auto !important}}
.card.rec{background:var(--panel2);border-left:4px solid var(--accent)}
.rec-action{font-size:19px;font-weight:700;margin:2px 0 6px}
.rec-line{color:var(--fg2);margin:2px 0}
.rec-next{color:var(--muted);font-size:13px;margin-top:8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;justify-content:space-between;align-items:baseline;flex-wrap:wrap}
ul.plain{list-style:none;margin:6px 0;padding:0}
ul.plain li{padding:3px 0;border-bottom:1px dotted var(--line)}
ul.plain li:last-child{border-bottom:0}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);
  padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.btn.big{padding:12px 28px;font-size:17px}
.btn.link{background:none;border:0;color:var(--accent);text-decoration:underline;padding:2px 4px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.badge{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;
  padding:0 8px;color:var(--fg2);background:var(--bg)}
.badge.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
.badge.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.badge.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-bg)}
.note{border-left:3px solid var(--line);padding:6px 10px;color:var(--fg2);font-size:13px;background:var(--bg)}
.note.warn{border-left-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.note.bad{border-left-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.note.ok{border-left-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{color:var(--fg2);font-weight:700;font-size:13px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
input[type=text],input[type=number],input[type=date],select,textarea{
  background:var(--bg);color:var(--fg);border:1px solid var(--line);
  border-radius:var(--radius);padding:6px 8px;font:inherit;width:100%}
textarea{min-height:64px;resize:vertical}
label{display:block;font-size:13px;color:var(--fg2);margin-bottom:3px}
.field{margin:0 0 12px}
details>summary{cursor:pointer;color:var(--fg2);padding:4px 0}
.tree{font-family:var(--mono);font-size:13px;white-space:pre-wrap;margin:0}
.kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:700px){.grid2{grid-template-columns:1fr}}

/* ===== 重ねる面（1欄編集面・ダイアログ） ===== */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;
  justify-content:center;padding:6vh 16px;z-index:60;overflow:auto}
.overlay[hidden]{display:none}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:8px;
  max-width:560px;width:100%;padding:18px 20px;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.sheet h2{font-size:17px;margin-bottom:4px}
.sheet .canon{font-size:12px;color:var(--muted);margin-bottom:10px}
.sheet .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}

/* ===== トースト ===== */
#toasts{position:fixed;right:16px;bottom:16px;z-index:80;display:flex;flex-direction:column;gap:8px;max-width:380px}
.toast{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--accent);
  border-radius:var(--radius);padding:10px 12px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.toast.bad{border-left-color:var(--bad)}
.toast.warn{border-left-color:var(--warn)}

/* ===== 印刷（意思決定カード：A4/レター1ページ） ===== */
@media print{
  .hd,nav.tabs,#toasts,.noprint{display:none !important}
  body{background:#fff;color:#000;font-size:12pt}
  main{max-width:none;padding:0}
  .card{border:1px solid #888;background:#fff;break-inside:avoid}
  .print-card{page-break-after:always}
}
</style>
</head>
<body>
<header class="hd noprint">
  <div class="hd-row">
    <span class="brand" id="brand">Waypoint</span>
    <label for="projSel" class="sr" style="margin:0"></label>
    <select id="projSel" aria-label="プロジェクト"></select>
    <button class="btn" id="btnNewProj" type="button">新しいプロジェクト</button>
    <button class="btn" id="btnOpen" type="button">JSONを読み込む</button>
    <span style="flex:1"></span>
    <button class="btn" id="btnTheme" type="button" title="テーマを切り替える">◐</button>
  </div>
  <div class="savebar" id="saveBar"></div>
  <nav class="tabs" id="tabs">
    <button type="button" data-screen="today" aria-current="true">今日の一手<span class="tabsub">1件だけ受け取る</span></button>
    <button type="button" data-screen="create">VUCを作る<span class="tabsub">案を1本立てる</span></button>
    <button type="button" data-screen="measure">測る・判定する<span class="tabsub">まとめて書く・宣言する</span></button>
    <button type="button" data-screen="log">航海日誌<span class="tabsub">記入結果を確認する</span></button>
    <button type="button" data-screen="settings">設定<span class="tabsub">しきい値と保存先</span></button>
    <button type="button" data-screen="tutorial">使い方<span class="tabsub">はじめての1周</span></button>
  </nav>
</header>

<main>
  <section id="voyage" aria-label="航海図"></section>
  <section id="screen-today"  class="screen"></section>
  <section id="screen-create" class="screen" hidden></section>
  <section id="screen-measure" class="screen" hidden></section>
  <section id="screen-log"    class="screen" hidden></section>
  <section id="screen-settings" class="screen" hidden></section>
  <section id="screen-tutorial" class="screen" hidden></section>
</main>

<div class="overlay" id="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="ovTitle">
  <div class="sheet" id="sheet"></div>
</div>
<div id="toasts" aria-live="polite"></div>

  "fields.valueHypothesis": "・過去の出荷実績から需要の波が読めるので、担当者の勘より欠品を減らせる\n・振動の変化が故障の2週間前に出るので、計画停止に振り替えられる\n・音声入力なら移動中に書けるので、記録が持ち帰りにならない\n・明細の型が決まっているので、差分だけ人が見れば足りる\n・前日の進捗が分かれば、翌日の手配を先に決められる\n・応対履歴が1画面にあれば、聞き直しが消える\n・不備の型が10通りに収まるので、受付の時点で判定できる\n・発注の判断根拠を言葉にできれば、パート従業員でも回せる\n・型番の近さで図面が引けるので、新規の作図が減る\n・残業と有休の組み合わせに兆しが出るので、面談を先に打てる\n（なぜ対価が生まれるかを1文で。「便利になる」は理由ではない）",

/* その段を「言える」ために要る事実は、付録Dから毎回つくる（散文で書き足してはいけない）。
   max を渡すと、帯に収まる長さへ畳む（全部は［この航海は何のためか］と1欄ずつの案内で出す） */
function voyageNeed(stateKey, max){
  var rule = promotionRule(stateKey);
  if (!rule) return "";
  var names = rule.required.map(requiredLabel), rest = 0;
  if (max && names.length > max){ rest = names.length - max; names = names.slice(0, max); }
  var s = names.join("／");
  if (rest) s += "／ほか " + rest + "件";
  if (rule.extra.length) s += (s ? "／" : "") + "条件 " + rule.extra.length + "件";
  return s;
}

function $(sel, root){ return (root||document).querySelector(sel); }
function el(tag, attrs, kids){
  var n = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function(k){
    if (k === "class") n.className = attrs[k];
    else if (k === "text") n.textContent = attrs[k];
    else if (k === "html") n.innerHTML = attrs[k];
    else if (k.indexOf("on") === 0) n.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) n.setAttribute(k, attrs[k]);
  });
  (kids||[]).forEach(function(c){ if (c) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return n;
}
function pad(n, w){ var s = String(n); while (s.length < w) s = "0" + s; return s; }
function todayISO(d){ var t = d || new Date();
  return t.getFullYear() + "-" + pad(t.getMonth()+1,2) + "-" + pad(t.getDate(),2); }
function nowISO(){
  var t = new Date(), off = -t.getTimezoneOffset(), sg = off >= 0 ? "+" : "-", a = Math.abs(off);
  return todayISO(t) + "T" + pad(t.getHours(),2) + ":" + pad(t.getMinutes(),2) + ":" + pad(t.getSeconds(),2)
       + sg + pad(Math.floor(a/60),2) + ":" + pad(a%60,2);
}
function stamp(d){ var t = d || new Date();
  return "" + t.getFullYear() + pad(t.getMonth()+1,2) + pad(t.getDate(),2)
       + "_" + pad(t.getHours(),2) + pad(t.getMinutes(),2) + pad(t.getSeconds(),2); }
/* E9: 日付の境界でずれない残日数。日単位に直してから引く */
function dayStart(x){
  if (!x) return null;
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(x));
  if (!m) { var d = new Date(x); if (isNaN(d)) return null; return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  return new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
}
function daysUntil(dateStr, ref){
  var a = dayStart(dateStr); if (!a) return null;
  var b = dayStart(ref || new Date()); if (!b) return null;
  return Math.round((a.getTime() - b.getTime()) / 86400000);
}
function fmtNum(n){
  if (n === null || n === undefined || isNaN(n)) return "―";
  var r = Math.round(n * 100) / 100;
  return r.toLocaleString("ja-JP");
}
function fmtSigned(n){ return (n > 0 ? "+" : "") + fmtNum(n); }
function esc(s){ return String(s === null || s === undefined ? "" : s); }

function getPath(obj, path){
  var cur = obj, parts = path.split(".");
  for (var i = 0; i < parts.length; i++){
    if (cur === null || cur === undefined) return undefined;
    cur = cur[parts[i]];
  }
  return cur;
}
function setPath(obj, path, val){
  var cur = obj, parts = path.split(".");
  for (var i = 0; i < parts.length - 1; i++){
    if (cur[parts[i]] === null || cur[parts[i]] === undefined) cur[parts[i]] = {};
    cur = cur[parts[i]];
  }
  cur[parts[parts.length-1]] = val;
}

/* ---- 6.2.1 セル型 ---- */
function newSource(type){
  return { type: type || "assumption", status: (type === "ai_draft" ? "draft_ai" : "confirmed"), note: "" };
}
function newSingleCell(){ return { v:null, blank:"not_measured", source:null }; }
function newPairCell(unit){
  return { expected:null, observed:null, unit: unit || null,
           source:{ expected:null, observed:null },
           blank:{ expected:"not_measured", observed:"not_measured" } };
}
function cellOf(vuc, key){ return getPath(vuc, key); }
/* 値が入っているか（na は「測った結果の対象外」なので充足とみなす・付録D） */
function singleFilled(cell, opts){
  if (!cell) return false;
  if (cell.blank === "na") return true;
  if (cell.blank) return false;
  if (cell.v === null || cell.v === undefined || cell.v === "") return false;
  if (opts && opts.judge && cell.source && cell.source.status === "draft_ai") return false;  /* V8 / E1 */
  return true;
}
function pairFilled(cell, side, opts){
  if (!cell) return false;
  var b = cell.blank ? cell.blank[side] : null;
  if (b === "na") return true;
  if (b) return false;
  var v = cell[side];
  if (v === null || v === undefined || v === "") return false;
  var s = cell.source ? cell.source[side] : null;
  if (opts && opts.judge && s && s.status === "draft_ai") return false;               /* V8 / E1 */
  return true;
}
/* 付録Dの必須欄キー（"fields.painCost.expected" のような側つきも分解する） */
function requiredFilled(vuc, key, opts){
  var m = /^(.*)\.(expected|observed)$/.exec(key);
  if (m && FIELD_BY_KEY[m[1]] && FIELD_BY_KEY[m[1]].t === "pair"){
    return pairFilled(cellOf(vuc, m[1]), m[2], opts);
  }
  var f = FIELD_BY_KEY[key];
  if (f && f.cell && f.t !== "pair")  return singleFilled(cellOf(vuc, key), opts);
  if (f && f.cell && f.t === "pair")   return pairFilled(cellOf(vuc, key), "expected", opts);
  var v = getPath(vuc, key);
  return !(v === null || v === undefined || v === "");
}
function requiredLabel(key){
  var m = /^(.*)\.(expected|observed)$/.exec(key);
  if (m && FIELD_BY_KEY[m[1]]) return FIELD_BY_KEY[m[1]].label + (m[2] === "expected" ? "（期待値）" : "（実測値）");
  return (FIELD_BY_KEY[key] || { label:key }).label;
}
function requiredFieldKey(key){
  var m = /^(.*)\.(expected|observed)$/.exec(key);
  return (m && FIELD_BY_KEY[m[1]]) ? m[1] : key;
}
/* 6.2.1 導出値の根拠：構成要素のうち最も弱いものを継承する */
function weakestSource(sources){
  var notMeasured = false, type = null, status = "confirmed";
  for (var i = 0; i < sources.length; i++){
    var s = sources[i];
    if (!s){ notMeasured = true; continue; }
    if (s.status === "draft_ai") status = "draft_ai";
    if (type === null || SOURCE_WEAK_ORDER.indexOf(s.type) < SOURCE_WEAK_ORDER.indexOf(type)) type = s.type;
  }
  if (notMeasured) return { notMeasured:true, type:null, status:status };
  return { notMeasured:false, type:type, status:status };
}
/* 出所の種別キー（文字列）から表示名を引く。
   出所オブジェクトを取る sourceLabel(src) とは別物。同じ名前にすると、
   あとから書いたほうが前を覆って（関数宣言は後勝ち）黙って "undefined" を返す */
function sourceTypeLabel(type){
  for (var i = 0; i < SOURCE_TYPES.length; i++) if (SOURCE_TYPES[i].k === type) return SOURCE_TYPES[i].label;
  return "未設定";
}
function chapterText(canon){
  if (!canon) return "";
  var p = String(canon).split("#"), ch = BOOK.chapters[p[0]];
  if (!ch) return "";
  return "第" + ch.no + "章" + (p[1] ? " " + p[1].replace("-", ".") : "");
}

/* ---- VUCの生成（6.3：新規作成時に全欄を「まだ測っていない」で初期化する） ---- */
function newVuc(seq){
  var v = {
    id: "VUC-" + pad(seq, 3),
    closed: null, closure: null,
    title: "", parent: null,
    state: "L0", assurance: "Lite", targetState: "L1",
    fields: {}, unmetEvidence: [],
    trace: { buc:[], suc:[], ac:[], adr:[] },
    gate4: {
      painReal:{pass:null, evidence:""}, payerExists:{pass:null, evidence:""},
      unitEconomics:{pass:null, evidence:""}, noFatalRisk:{pass:null, evidence:""},
      result:null, decidedAt:null, decidedBy:""
    },
    economics: { tokens:null, observations:[] },
    stopCriteria: { target:"", threshold:null, unit:null, deadline:null, writtenAt:null },
    gate: { criteria:"", dueDate:null },
    seqs: { buc:0, suc:0, ac:0, ue:0 },
    log: []
  };
  CELL_FIELDS.forEach(function(f){
    setPath(v, f.k, f.t === "pair" ? newPairCell(f.units[0] || null) : newSingleCell());
  });
  v.log.push({ at: nowISO(), type:"create", from:null, to:v.id });
  return v;
}
function logChange(vuc, type, key, from, to){
  vuc.log.push({ at: nowISO(), type:type, key:key||null, from: from===undefined?null:from, to: to===undefined?null:to });
  if (vuc.log.length > 500) vuc.log.splice(0, vuc.log.length - 500);
}

/* =========================================================================
   2 意思決定基盤：記述粒度と採算、昇格、入力検証、ゲート
   ========================================================================= */
/* 付録D 末尾：Core ＝ #4〜#7 の単一値9欄がすべて not_measured でない */
function computeAssurance(vuc){
  for (var i = 0; i < CORE_SINGLE_FIELDS.length; i++){
    if (!singleFilled(cellOf(vuc, CORE_SINGLE_FIELDS[i]))) return "Lite";
  }
  return "Core";
}
function liteRemaining(vuc){
  var need = ["fields.workaround","fields.payer"], miss = [];
  need.forEach(function(k){ if (!singleFilled(cellOf(vuc,k))) miss.push(k); });
  if (!vuc.unmetEvidence.some(function(u){ return !u.resolvedAt; })) miss.push("unmetEvidence[]");
  return miss;
}
function isLiteDone(vuc){ return liteRemaining(vuc).length === 0; }

/* ---- 6.9 最小採算 ---- */
var ECON_KEYS = ["K","P","Q","c","U","D"];
function econRaw(vuc, sym, side){
  var cell = vuc.economics ? vuc.economics[sym] : null;
  if (!cell) return null;
  var b = cell.blank ? cell.blank[side] : null;
  if (b) return null;
  var v = cell[side];
  return (v === null || v === undefined || v === "") ? null : Number(v);
}
function econSource(vuc, sym, side){
  var cell = vuc.economics ? vuc.economics[sym] : null;
  return cell && cell.source ? cell.source[side] : null;
}
function tokensGen(vuc, side){
  var cell = vuc.economics ? vuc.economics.tokens : null;
  if (!cell) return null;
  if (cell.blank && cell.blank[side]) return null;
  var t = cell[side];
  if (!t) return null;
  var tin = Number(t.tIn||0), pin = Number(t.pIn||0), tout = Number(t.tOut||0), pout = Number(t.pOut||0);
  if (!tin && !tout) return null;
  return (tin * pin + tout * pout) / TOKENS_DIVISOR;
}
/* opts.judge=true のとき draft_ai の値は未測定として扱う（V8） */
function computeEconomics(vuc, side, opts){
  var e = {}, sources = [], missing = [];
  ECON_KEYS.forEach(function(sym){
    var v = econRaw(vuc, sym, side), s = econSource(vuc, sym, side);
    if (opts && opts.judge && s && s.status === "draft_ai") v = null;
    e[sym] = v;
    if (v === null) missing.push(sym); else sources.push(s);
  });
  var core = ["K","P","Q","c","U"];
  var complete = core.every(function(sym){ return e[sym] !== null; });
  var out = { side:side, values:e, missing:missing, complete:complete,
              revenue:null, variableCost:null, contribution:null, payback:null,
              cGen: tokensGen(vuc, side), source:null };
  /* 6.2.1 導出値の根拠は、構成要素のうち最も弱いものを継承する（対象5欄。保存はしない） */
  function inherit(syms, withTokens){
    var list = syms.map(function(sym){ return econSource(vuc, sym, side); });
    if (withTokens){
      var tc = vuc.economics ? vuc.economics.tokens : null;
      list.push(tc && tc.source ? tc.source[side] : null);
    }
    return weakestSource(list);
  }
  out.sources = {
    revenue:      inherit(["K","P"]),
    variableCost: inherit(["Q","c"]),
    contribution: inherit(core),
    paybackMonths: inherit(core.concat(["D"])),
    cGen:         inherit([], true)
  };
  out.source = out.sources.contribution;
  if (complete){
    out.revenue = e.K * e.P;
    out.variableCost = e.Q * e.c;
    out.contribution = out.revenue - out.variableCost - e.U;
    /* E6: 貢献利益が0以下のとき、開発費の回収月数は出さない */
    if (e.D !== null && out.contribution > 0) out.payback = e.D / out.contribution;
  }
  return out;
}
/* 6.9.1(1) 前提ごとの根拠。実測として数えるのは measurement だけ */
function economicsEvidence(vuc, side){
  return ECON_KEYS.concat(["tokens"]).map(function(sym){
    var s = econSource(vuc, sym, side);
    /* 渡すのは種別キー（文字列）なので、出所オブジェクトを取る sourceLabel ではないほうを呼ぶ */
    return { sym:sym, type: s ? s.type : null, label: s ? sourceTypeLabel(s.type) : "未測定",
             measured: !!(s && s.type === "measurement") };
  });
}
function measuredCount(vuc, side){
  return economicsEvidence(vuc, side).filter(function(x){ return x.measured; }).length;
}
/* 6.9.2 黒字化の条件を逆算する（π は6変数の一次式。他を固定して1つを解く） */
function computeBreakeven(e){
  var K = e.values.K, P = e.values.P, Q = e.values.Q, c = e.values.c, U = e.values.U;
  if (!e.complete) return [];
  var R = e.revenue, C = e.variableCost, out = [];
  function push(key, label, from, to, dir, unit){
    if (to === null || !isFinite(to) || to < 0) return;
    var pct = (from === 0) ? null : ((to - from) / from) * 100;
    out.push({ key:key, label:label, from:from, to:to, dir:dir, pct:pct, unit:unit });
  }
  if (K > 0)            push("P", FIELD_BY_KEY["economics.P"].label, P, (C + U) / K, "以上", "円/社・月");
  if (Q > 0)            push("c", FIELD_BY_KEY["economics.c"].label, c, (R - U) / Q, "以下", "円/件");
  if (P > 0)            push("K", FIELD_BY_KEY["economics.K"].label, K, (C + U) / P, "以上", "社");
  if (c > 0)            push("Q", FIELD_BY_KEY["economics.Q"].label, Q, (R - U) / c, "以下", "件/月");
  push("U", FIELD_BY_KEY["economics.U"].label, U, R - C, "以下", "円/月");
  return out;
}
/* 採算の見方：L3 は期待値、L4・L5 は実測値（6.7.1 要注意1） */
function economicsSideFor(state){ return (state === "L4" || state === "L5") ? "observed" : "expected"; }

/* ---- ゲート4条件（論理積。総合点は出さない・R3） ---- */
var GATE_KEYS = ["painReal","payerExists","unitEconomics","noFatalRisk"];
function gateNo(key){ return GATE_KEYS.indexOf(key) + 1; }
function gateResult(vuc){
  var all = GATE_KEYS.every(function(k){ return vuc.gate4[k].pass === true; });
  return all ? "passed" : null;
}
function gateDecided(vuc){ return GATE_KEYS.every(function(k){ return vuc.gate4[k].pass !== null; }); }

/* ---- 付録D：昇格の検査（この表だけを見る） ---- */
function promotionRule(toState){
  for (var i = 0; i < PROMOTION.length; i++) if (PROMOTION[i].to === toState) return PROMOTION[i];
  return null;
}
function nextStateOf(state){
  var i = STATE_KEYS.indexOf(state);
  return (i >= 0 && i < STATE_KEYS.length - 1) ? STATE_KEYS[i+1] : null;
}
function checkPromotion(vuc, toState, st){
  var rule = promotionRule(toState);
  var res = { ok:true, to:toState, rule:rule, missing:[], warnings:[], blocks:[] };
  if (!rule) { res.ok = false; res.blocks.push("その段の条件が定義されていません"); return res; }
  /* 段は飛ばせない */
  if (rule.from !== null && vuc.state !== rule.from){
    res.ok = false;
    res.blocks.push("段は飛ばせません。いまは " + vuc.state + " なので、上げられるのは " + nextStateOf(vuc.state) + " です");
    return res;
  }
  rule.required.forEach(function(key){
    if (!requiredFilled(vuc, key, { judge:true })){
      res.missing.push({ key:key, field:requiredFieldKey(key), label:requiredLabel(key) });
    }
  });
  rule.extra.forEach(function(x){
    if (x.kind === "evidence"){
      var cell = cellOf(vuc, x.key), s = cell && cell.source ? cell.source[x.side] : null;
      var ok = !!(s && EVIDENCE_TYPES.indexOf(s.type) >= 0 && s.status !== "draft_ai");
      if (cell && cell.blank && cell.blank[x.side] === "na") ok = true;
      if (!ok) res.blocks.push(x.msg);
    } else if (x.kind === "gate4decided"){
      if (!gateDecided(vuc)) res.blocks.push(x.msg);
    } else if (x.kind === "gate4passed"){
      if (gateResult(vuc) !== "passed") res.blocks.push(x.msg);
    } else if (x.kind === "trace"){
      var bad = x.layers.filter(function(L){
        return !(vuc.trace[L] || []).some(function(r){ return r.status === "confirmed"; });
      });
      if (bad.length) res.blocks.push(x.msg + "（不足：" + bad.map(function(L){ return TRACE_LAYER_LABEL[L]; }).join("・") + "）");
    } else if (x.kind === "contributionObserved"){
      /* 付録D：K・P・Q・c・U のどれかが na だと貢献利益が計算できない。
         必須欄の検査は na で通るので、ここで止めて「どの欄がそうなのか」を名指しする
         （件数や割合は出さない・R7）。 */
      var eo = computeEconomics(vuc, "observed", { judge:true });
      if (!eo.complete){
        var core5 = ["K","P","Q","c","U"];
        var lack = eo.missing.filter(function(sym){ return core5.indexOf(sym) >= 0; })
          .map(function(sym){
            var ef = FIELD_BY_KEY["economics." + sym], ec = cellOf(vuc, "economics." + sym);
            var isNa = !!(ec && ec.blank && ec.blank.observed === "na");
            return (ef ? ef.label : sym) + (isNa ? "（該当なし）" : "（未測定）");
          });
        res.blocks.push(x.msg + (lack.length ? "：" + lack.join("・") : ""));
      }
    } else if (x.kind === "reproduction"){
      var n = reproductionCount(vuc), need = st.thresholds.reproductionCount;
      var un = uncountedPeriods(vuc), why = [];
      if (un.solo) why.push("顧客が1社の期間 " + un.solo + " 件（複数顧客で黒字が再現した実績にならない・本書 表7-4）");
      if (un.unknown) why.push("顧客数が記録されていない期間 " + un.unknown + " 件（その期間の実測を入れ直すと数えられる）");
      if (n < need) res.blocks.push(x.msg + "（いま " + n + " 回／設定は " + need + " 回）"
        + (why.length ? "。数えなかったもの：" + why.join("／") : ""));
    } else if (x.kind === "warnStop"){
      if (!stopCriteriaWritten(vuc)) res.warnings.push(x.msg);
    }
  });
  /* V4：中止基準の未記入は L2→L3 でブロックする */
  if (toState === "L3" && !stopCriteriaWritten(vuc)){
    if (!res.missing.some(function(m){ return m.key.indexOf("stopCriteria.") === 0; })){
      res.missing.push({ key:"stopCriteria.target", field:"stopCriteria.target", label:requiredLabel("stopCriteria.target") });
    }
  }
  res.ok = (res.missing.length === 0 && res.blocks.length === 0);
  return res;
}
function stopCriteriaWritten(vuc){
  var s = vuc.stopCriteria || {};
  return !!(s.target && s.threshold !== null && s.threshold !== "" && s.unit && s.deadline);
}
/* L5：異なる観測期間で黒字だった件数だけを数える（log の日付からは数えない）。
   本書 表7-4 の L4→L5 は「複数顧客・複数期間にわたり黒字」なので、顧客が1社の期間は再現に数えない。
   2 は本書が定めた数（複数＝2社以上）であって、プロジェクト設定のつまみではない */
function reproductionCount(vuc){
  var seen = {}, n = 0;
  (vuc.economics.observations || []).forEach(function(o){
    if (o.contribution !== null && o.contribution > 0 && o.K != null && o.K >= 2 && !seen[o.period]){ seen[o.period] = true; n++; }
  });
  return n;
}
/* 黒字なのに再現に数えなかった期間を、理由ごとに数える（silent failure を作らない）。
   solo＝顧客が1社／unknown＝顧客数が記録されていない（古い台帳から読み込んだ場合）。
   この2つを混ぜると、直し方の違う2つの状態が同じ文言になる */
function uncountedPeriods(vuc){
  var seen = {}, out = { solo:0, unknown:0 };
  (vuc.economics.observations || []).forEach(function(o){
    if (o.contribution === null || o.contribution <= 0 || seen[o.period]) return;
    if (o.K == null){ seen[o.period] = true; out.unknown++; }
    else if (o.K < 2){ seen[o.period] = true; out.solo++; }
  });
  return out;
}

/* ---- 6.13 入力検証 ---- */
function validate(vuc, when, st){
  var out = [];
  function add(id, level, msg, field){ out.push({ id:id, level:level, msg:msg, field:field||null }); }
  if (when === "gateDecide"){
    if (!gateDecided(vuc)){
      var un = GATE_KEYS.filter(function(k){ return vuc.gate4[k].pass === null; });
      add("V2","block","条件" + un.map(gateNo).join("・") + "が未判定です。これが決まると着手の可否が出ます", "gate4." + un[0]);
    }
  }
  if (when === "decision"){
    if (!vuc.gate.criteria){
      add("V11","block","なぜそう判断したかが1行も残っていません。1行でよいので書いてください", "gate.criteria");
    }
  }
  /* V3・V9・V10 は常時（データとして作らせない） */
  if (gateResult(vuc) !== "passed" && vuc.gate4.result === "passed") add("V3","block","ゲート4条件に不成立があるのに結果が成立になっています");
  if (vuc.closed && !vuc.closure) add("V9","block","終了しているのに、やめた理由と分類が残っていません");
  if (vuc.closed === "pivoted" && !(vuc.closure && vuc.closure.successor)) add("V10","block","Pivot は後継が1本あって初めて Pivot です");
  /* V5 実測値があるのに根拠が空（保存時の警告） */
  CELL_FIELDS.filter(function(f){ return f.t === "pair"; }).forEach(function(f){
    var cell = cellOf(vuc, f.k);
    if (cell && cell.observed !== null && cell.observed !== undefined && cell.observed !== "" &&
        (!cell.source || !cell.source.observed)){
      add("V5","warn", f.label + "に実測値が入っていますが、どこから来た値かが空です", f.k);
    }
  });
  return out;
}
/* V6：IDの重複・再利用 */
function checkIdUniqueness(data){
  var seen = {}, dup = [];
  (data.vucs||[]).forEach(function(v){ if (seen[v.id]) dup.push(v.id); seen[v.id] = true; });
  return dup;
}
/* V7：closed が null でないVUCは読み取り専用 */
function isReadOnly(vuc){ return !!vuc.closed; }

/* =========================================================================
   6.8 「次の一手」の生成（9段の固定順序。点数も乱数も使わない）
   文面は付録C末尾の雛形からしか組み立てない。
   ========================================================================= */
function fill(tpl, vars){
  return tpl.replace(/\{(\w+)\}/g, function(_, k){
    return (vars[k] === null || vars[k] === undefined) ? "" : String(vars[k]);
  });
}
function mkAction(order, sub, vuc, vars, extra){
  var t = NEXT_TEMPLATES[sub];
  var a = { order:order, sub:sub, vucId:vuc.id, group:99, deadline:null, fieldKey:null, ueId:null,
            updated: lastTouched(vuc),
            action:fill(t.action, vars), why:fill(t.why, vars), cost:fill(t.cost, vars) };
  if (extra) Object.keys(extra).forEach(function(k){ a[k] = extra[k]; });
  return a;
}
function nextActions(vuc, st){
  if (vuc.closed) return [];                                  /* 終えたVUCに一手はない */
  var out = [], i;
  var dl = vuc.stopCriteria ? vuc.stopCriteria.deadline : null;
  var dn = dl ? daysUntil(dl) : null;
  var target = (vuc.stopCriteria && vuc.stopCriteria.target) ? vuc.stopCriteria.target
                                                             : FIELD_BY_KEY["stopCriteria.target"].label;

  /* 順序1：期限の超過を先に、次に deadlineWarnDays 以内 */
  if (dn !== null){
    if (dn < 0) out.push(mkAction(1, "1a", vuc, { target:target, N:Math.abs(dn) },
                                  { deadline:dn, group:21, fieldKey:"stopCriteria.deadline" }));
    else if (dn <= st.thresholds.deadlineWarnDays)
      out.push(mkAction(1, "1b", vuc, { target:target, N:dn },
                        { deadline:dn, group:21, fieldKey:"stopCriteria.deadline" }));
  }
  /* 順序2：未充足エビデンスのうち blocks が "other" 以外（blocks の並びがそのまま優先順）。
     "other"（何も止めていない）は順序9として、機械的導出の後ろへ回す（6.8・6.7.1・付録C）。
     ウィザード手順8（6.7.2）は関連欄を聞かず既定が "other" なので、順序2に置くと
     作ったばかりのVUCで「何も止めていないメモ」が採算やゲート、昇格の一手より上に居座る。 */
  var ues = (vuc.unmetEvidence||[]).filter(function(u){ return !u.resolvedAt; });
  ues.sort(function(a,b){ return BLOCKS_ORDER.indexOf(a.blocks||"other") - BLOCKS_ORDER.indexOf(b.blocks||"other"); });
  ues.forEach(function(u){
    var b = u.blocks || "other", other = (b === "other");
    out.push(mkAction(other ? 9 : 2, other ? "9" : "2", vuc, { text:u.text, blocks: BLOCKS_LABEL[b] },
                      { deadline:dn, group:20, fieldKey:u.field||null, ueId:u.id }));
  });
  /* 順序3：採算が不成立のまま L3 以降 */
  var si = STATE_KEYS.indexOf(vuc.state);
  if (si >= 3){
    var side = economicsSideFor(vuc.state), e = computeEconomics(vuc, side, { judge:true });
    if (e.complete && e.contribution <= 0){
      out.push(mkAction(3, "3", vuc, { amount: fmtNum(e.contribution) + " 円/月" },
                        { deadline:dn, group:15, fieldKey:"economics.P" }));
    }
  }
  /* 順序4：pass:false がある */
  GATE_KEYS.forEach(function(k){
    if (vuc.gate4[k].pass === false)
      out.push(mkAction(4, "4", vuc, { n:gateNo(k), state:vuc.state },
                        { deadline:dn, group:21, fieldKey:"gate4."+k }));
  });
  /* 順序5：pass:null がある。
     ただし L2 以降でだけ出す（著者の決定・2026-09-19）。付録Dはゲート4条件を L2→L3 の条件に置き、
     要注意2・5 も「L3以降」で守っている。ここだけ段の条件が無いと、作りたてのL0で
     「ゲート条件1を判定する」が最上位に出て、航海図の「いま向かっているのはL1」と食い違う。
     順序4（不成立）には条件を足していない。すでに人が判定した事実を隠さないため。 */
  if (si >= 2){
    GATE_KEYS.forEach(function(k){
      if (vuc.gate4[k].pass === null)
        out.push(mkAction(5, "5", vuc, { n:gateNo(k) }, { deadline:dn, group:21, fieldKey:"gate4."+k }));
    });
  }
  /* 順序6：targetState への昇格に必要な必須欄が未測定 */
  var tgt = vuc.targetState || nextStateOf(vuc.state);
  if (tgt && STATE_KEYS.indexOf(tgt) > si){
    var step = nextStateOf(vuc.state), rule = step ? promotionRule(step) : null;
    if (rule){
      rule.required.forEach(function(key){
        if (!requiredFilled(vuc, key, { judge:true })){
          var fk = requiredFieldKey(key), f = FIELD_BY_KEY[fk] || { label:key, g:99, canon:"" };
          out.push(mkAction(6, "6", vuc,
            { label: requiredLabel(key), chapter: chapterText(f.canon) || "本書", targetState: step },
            { deadline:dn, group:f.g, fieldKey:fk }));
        }
      });
    }
  }
  /* 順序7：トレースの層が欠落。
     順序5と同じ理由で L3 以降でだけ出す（著者の決定・2026-09-19 の原則をそろえた）。
     トレースが要るのは L3→L4 の昇格で、要注意5 も「L3以降」で守られている。
     ここだけ段の条件が無いと、作りたてのL0で「BUCを1件つくって接続する（L4で必要）」が
     最上位に出て、航海図の「次に宣言できるのは L1」と食い違う。 */
  ["buc","suc","ac"].forEach(function(L){
    var rows = vuc.trace[L] || [];
    /* 付録D が L3→L4 に求めるのは「実体を確認した」行なので、ここも confirmed で見る。
       「IDを振った」で止まっている層を connected 扱いにすると、昇格は止まるのに
       その理由が一手として出ない（欠けていることを名指ししない・6.8）。
       行が既にあるかどうかで雛形を分ける（無い＝作る／有る＝確認する）。 */
    var confirmed = rows.some(function(r){ return r.status === "confirmed"; });
    if (!confirmed && si >= 3){
      var exists = rows.some(function(r){ return r.status && r.status !== "none"; });
      out.push(mkAction(7, exists ? "7c" : "7", vuc, { layer: TRACE_LAYER_LABEL[L] },
                        { deadline:dn, group:9, fieldKey:"trace."+L+"[]" }));
    }
  });
  /* 順序8：expected はあるが observed が未測定。
     実測が判定に反映されるのは L4 以降（要注意1 は「L3 は期待値、L4・L5 は実測値で見る」）なので、
     順序5・7 と同じ規則で L4 以降でだけ出す。 */
  if (si >= 4){
    CELL_FIELDS.filter(function(f){ return f.t === "pair"; }).forEach(function(f){
      var cell = cellOf(vuc, f.k);
      if (pairFilled(cell, "expected") && !pairFilled(cell, "observed"))
        out.push(mkAction(8, "8", vuc, { label:f.label }, { deadline:dn, group:f.g, fieldKey:f.k }));
    });
  }

  /* 重複を防ぐ：機械が導出した一手と同じ欄を指す未充足エビデンスがあれば、
     ユーザーが書いた文面を残し、機械側の定型文を取り除く（6.7.1）。
     **まとめるのは順序2のメモだけである。** 順序9（何も止めていない）へ回ったメモで機械側を取り除くと、
     その欄についての一手が最上位から最下位へ移動して画面から消えたように見える。
     詳細設定で blocks を手で "other" にした項目がこの経路に入る（6.8・順序9の但し書き）。 */
  var ueFields = {};
  out.forEach(function(a){ if (a.ueId && a.order === 2 && a.fieldKey) ueFields[a.fieldKey] = true; });
  out = out.filter(function(a){ return !(!a.ueId && a.fieldKey && ueFields[a.fieldKey]); });

  out.sort(compareActions);
  return out;
}
/* 同じ順位の中では、判断期限が近いもの → 欄グループ番号の小さい順 → 最終更新が新しい順
   （乱数とスコアは使わない。同じデータからは常に同じ順序が出る） */
function compareActions(a, b){
  if (a.order !== b.order) return a.order - b.order;
  var ad = (a.deadline === null ? Infinity : a.deadline), bd = (b.deadline === null ? Infinity : b.deadline);
  if (ad !== bd) return ad - bd;
  if (a.group !== b.group) return a.group - b.group;
  var au = a.updated || "", bu = b.updated || "";
  if (au !== bu) return bu.localeCompare(au);
  return String(a.vucId).localeCompare(String(b.vucId));
}
/* 一手が無い状態を認める（6.8）。待ちであることと次に見る日を返す。
   材料がそろっていて、あとは人が宣言するかどうかだけ、という状態もここに来る。
   「上げられます」とは書かない（付録D：ツールは促さない）。事実と、操作の置き場所だけを言う。 */
function waitingState(vuc){
  if (vuc.closed) return null;
  var due = vuc.gate && vuc.gate.dueDate ? vuc.gate.dueDate : null;
  var vs = voyageState(vuc, st());
  if (vs.nextK && vs.res && vs.res.missing.length === 0 && vs.res.blocks.length === 0){
    return "いま測るものはありません。" + vs.nextK + " を言うために要る事実はそろっています。"
         + "ここから先は、「ここまで確かめた」と宣言するかどうかの判断です（［測る・判定する］の下段）"
         + (due ? "。次の判定は " + due : "");
  }
  if (due) return "いま動かせるものはない。次の判定は " + due;
  return "いま動かせるものはない。次に判定する日を決めておくと、安心して閉じられる";
}
/* 全VUC横断：最上位の一手（同順位が複数VUCにまたがるときは最終更新が新しい方） */
function allActions(data, st){
  var rows = [];
  (data.vucs||[]).forEach(function(v){
    nextActions(v, st).forEach(function(a){ rows.push(a); });
  });
  rows.sort(compareActions);
  return rows;
}
/* 固定順序（6.8）は「効きの順」であって、上から順にやらなければならない手順ではない。
   順序6（次の段に要る欄）のように、同じ段の中では、どれから書いても構わないものが並ぶ。
   だから出ている1件を飛ばして、同じ案件の次の1件へ移れるようにしてある。
   飛ばした記録は S に持ち、台帳には書かない（飛ばしたことは事業の事実ではない）。 */
function actionKey(a){
  return a.order + "/" + a.sub + "/" + (a.fieldKey || "") + "/" + (a.ueId || "");
}
function skipList(vucId){
  if (!S.skipped[vucId]) S.skipped[vucId] = [];
  return S.skipped[vucId];
}
/* その案件の一手のうち、いま出す1件を決める。
   全部飛ばしたら記録を捨てて先頭へ戻す（連打しても同じ案件の中を回り、行き止まりにならない）。 */
function pickAction(vucId, mine){
  if (!mine || !mine.length) return { rec:null, next:null, index:0, total:0, skipped:0 };
  var sk = skipList(vucId), live = {}, i;
  mine.forEach(function(a){ live[actionKey(a)] = true; });
  /* 書いて消えた一手が記録に残ると、何件目なのかの表示が合わなくなる。先に取り除く */
  for (i = sk.length - 1; i >= 0; i--) if (!live[sk[i]]) sk.splice(i, 1);
  var rest = mine.filter(function(a){ return sk.indexOf(actionKey(a)) < 0; });
  if (!rest.length){ sk.length = 0; rest = mine.slice(); }
  return { rec:rest[0], next:rest[1] || null, total:mine.length,
           index:mine.length - rest.length + 1, skipped:sk.length };
}
function markSkipped(vucId, a){
  var sk = skipList(vucId), k = actionKey(a);
  if (sk.indexOf(k) < 0) sk.push(k);
  return sk.length;
}
function skipAction(vucId, a, total){
  markSkipped(vucId, a);
  toast(skipList(vucId).length >= total
        ? "ひと回りしたので、いちばん上の一手へ戻ります"
        : "この一手を飛ばしました。飛ばした件は、開き直すとまた出ます");
  renderAll();
}
function lastTouched(vuc){
  var l = vuc.log && vuc.log.length ? vuc.log[vuc.log.length-1].at : "";
  return l || "";
}

/* =========================================================================
   6.7.1 要注意の選出（並びは 4,1,2,3,5）
   ========================================================================= */
function attentionItems(data, st){
  var items = [];
  (data.vucs||[]).forEach(function(v){
    if (v.closed) return;
    var si = STATE_KEYS.indexOf(v.state);
    var dn = v.stopCriteria && v.stopCriteria.deadline ? daysUntil(v.stopCriteria.deadline) : null;
    if (dn !== null && dn < 0)
      items.push({ rank:0, vucId:v.id, text:"判断期限を " + Math.abs(dn) + "日 超過している" });
    if (si >= 3){
      var side = economicsSideFor(v.state), e = computeEconomics(v, side, { judge:true });
      if (side === "expected"){
        if (e.complete && e.contribution <= 0)
          items.push({ rank:1, vucId:v.id, text:"採算が不成立のまま " + v.state + " にいる（期待値の貢献利益 " + fmtNum(e.contribution) + " 円/月）" });
      } else {
        if (e.complete && e.contribution <= 0)
          items.push({ rank:1, vucId:v.id, text:"実測の貢献利益が " + fmtNum(e.contribution) + " 円/月（" + v.state + "）" });
        else if (!e.complete){
          var age = staleObservedDays(v);
          if (age === null || age > st.thresholds.staleObservedDays)
            items.push({ rank:1, vucId:v.id, text:"実測が " + st.thresholds.staleObservedDays + "日を超えて入っていない（" + v.state + "）" });
        }
      }
    }
    if (si >= 3 && GATE_KEYS.some(function(k){ return v.gate4[k].pass === false; }))
      items.push({ rank:2, vucId:v.id, text:"ゲート4条件に不成立があるのに " + v.state + " にいる" });
    if (dn !== null && dn >= 0 && dn <= st.thresholds.deadlineWarnDays)
      items.push({ rank:3, vucId:v.id, text:"判断期限まで残り " + dn + "日" });
    if (si >= 3){
      var broken = ["suc","ac"].filter(function(L){
        var rows = v.trace[L] || [];
        return rows.length === 0 || rows.every(function(r){ return r.status === "none"; });
      });
      if (broken.length)
        items.push({ rank:4, vucId:v.id, text:"トレースが断絶している（" + broken.map(function(L){ return TRACE_LAYER_LABEL[L]; }).join("・") + "）" });
    }
  });
  items.sort(function(a,b){ return a.rank - b.rank || String(a.vucId).localeCompare(String(b.vucId)); });
  return items;
}
function staleObservedDays(vuc){
  var last = null;
  (vuc.log||[]).forEach(function(l){
    if (l.type === "field" && l.key && l.key.indexOf(".observed") > 0) last = l.at;
  });
  (vuc.economics.observations||[]).forEach(function(o){ if (!last || o.recordedAt > last) last = o.recordedAt; });
  if (!last) return null;
  var d = daysUntil(last);
  return d === null ? null : -d;
}

/* =========================================================================
   6.7.1 前回からの変化（log と、端末側の lastSeenAt からだけ作る）
   ========================================================================= */
function changeSummary(data, sinceISO){
  if (!sinceISO) return [];
  var rows = [];
  (data.vucs||[]).forEach(function(v){
    (v.log||[]).forEach(function(l){
      if (l.at <= sinceISO) return;
      if (l.type === "field"){
        var fk = requiredFieldKey(String(l.key||"").replace(/\.(expected|observed)$/, ""));
        var f = FIELD_BY_KEY[fk];
        rows.push({ kind:0, at:l.at, text: v.id + " " + (f ? f.label : l.key) + " "
                   + describeVal(l.from) + " → " + describeVal(l.to) });
      } else if (l.type === "state"){
        var up = STATE_KEYS.indexOf(l.to) > STATE_KEYS.indexOf(l.from);
        rows.push({ kind:1, at:l.at, text: v.id + " " + l.from + " → " + l.to + " に" + (up ? "昇格" : "降格") });
      } else if (l.type === "create"){
        rows.push({ kind:3, at:l.at, text: v.id + " を新規作成" });
      } else if (l.type === "closed"){
        var cat = CLOSURE_CATEGORIES.filter(function(c){ return c.k === l.key; })[0];
        rows.push({ kind:3, at:l.at, text: v.id + " を " + (l.to === "killed" ? "Kill" : "Pivot")
                   + "（" + (cat ? cat.label : "理由の記録あり") + "）" });
      }
    });
    /* 判断期限の残日数の変化（新しい入力欄は作らない。期限と前回時刻から出す） */
    var dl = v.stopCriteria ? v.stopCriteria.deadline : null;
    if (dl && !v.closed){
      var was = daysUntil(dl, sinceISO), now = daysUntil(dl, new Date());
      if (was !== null && now !== null && was !== now)
        rows.push({ kind:2, at:nowISO(), text: v.id + " 判断期限まで " + was + "日 → " + now + "日" });
    }
  });
  rows.sort(function(a,b){ return a.kind - b.kind || String(b.at).localeCompare(String(a.at)); });
  return rows;
}
function describeVal(x){
  if (x === null || x === undefined || x === "") return "未測定";
  if (x === "na") return "該当なし";
  if (typeof x === "number") return fmtNum(x);
  if (typeof x === "object") return JSON.stringify(x);
  return String(x);
}

/* =========================================================================
   6.4 永続化 / 6.5 プロジェクト切替
   保存層は save() / saveAs() / open() / describe() の4つで抽象化する。
   ========================================================================= */
var BOOK = JSON.parse(document.getElementById("book-index").textContent);
var LS_PREFIX = "sme.vucledger.v4.";
var lsOK = (function(){
  try { localStorage.setItem(LS_PREFIX + "probe", "1"); localStorage.removeItem(LS_PREFIX + "probe"); return true; }
  catch (e) { return false; }
})();
function lsGet(k, fallback){
  if (!lsOK) return fallback;
  try { var s = localStorage.getItem(LS_PREFIX + k); return s === null ? fallback : JSON.parse(s); }
  catch (e) { return fallback; }
}
function lsSet(k, v){
  if (!lsOK) return false;
  try { localStorage.setItem(LS_PREFIX + k, JSON.stringify(v)); return true; } catch (e) { return false; }
}
function lsDel(k){ if (lsOK) { try { localStorage.removeItem(LS_PREFIX + k); } catch (e) {} } }

var S = {
  data: null, mode: "download", handle: null, handleName: "",
  dirty: false, dirtyCount: 0, lastBackupAt: null, lastFormalSave: lsGet("lastFormalSave", null),
  screen: "today", focusVuc: null, wizard: null, modeNoticeShown: false,
  /* 飛ばした一手（VUCごと）。画面の状態であって事業の事実ではないので、JSONにも自動保存にも入れない。
     開き直せば空に戻る＝飛ばした件は、また最上位から出る（6.7.1） */
  skipped: {}
};
/* 起動時の「暫定」判定。実際の保存が失敗したらダウンロードへ切り替える（6.4.2） */
S.mode = (typeof window.showSaveFilePicker === "function" && !lsGet("forcedDownload", false))
         ? "overwrite" : "download";

function thresholds(){
  var t = {};
  THRESHOLD_DEFS.forEach(function(d){ t[d.k] = d.def; });
  var proj = S.data && S.data.settings && S.data.settings.thresholds ? S.data.settings.thresholds : {};
  PROJECT_THRESHOLD_KEYS.forEach(function(k){
    if (proj[k] !== undefined && proj[k] !== null) t[k] = proj[k];
  });
  var dev = lsGet("deviceThresholds", {});
  if (dev.recentProjectsMax !== undefined && dev.recentProjectsMax !== null) t.recentProjectsMax = dev.recentProjectsMax;
  return t;
}
function st(){ return { thresholds: thresholds() }; }

/* ---- IndexedDB：上書きモードのファイルハンドルを覚える ---- */
function idb(){
  return new Promise(function(res, rej){
    var r = indexedDB.open("waypoint_handles", 1);
    r.onupgradeneeded = function(){ r.result.createObjectStore("h"); };
    r.onsuccess = function(){ res(r.result); };
    r.onerror = function(){ rej(r.error); };
  });
}
async function idbPut(key, val){
  try { var db = await idb(); await new Promise(function(res, rej){
    var tx = db.transaction("h", "readwrite"); tx.objectStore("h").put(val, key);
    tx.oncomplete = res; tx.onerror = function(){ rej(tx.error); }; }); } catch (e) {}
}
async function idbGet(key){
  try { var db = await idb(); return await new Promise(function(res){
    var tx = db.transaction("h", "readonly"), rq = tx.objectStore("h").get(key);
    rq.onsuccess = function(){ res(rq.result); }; rq.onerror = function(){ res(null); }; }); }
  catch (e) { return null; }
}

/* ---- プロジェクトの器 ---- */
function newProject(name){
  var id = "prj_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  var th = {};
  PROJECT_THRESHOLD_KEYS.forEach(function(k){ th[k] = THRESHOLD_DEFAULTS[k]; });
  th.setAt = null;
  return {
    schema: APP.schema, book: APP.book, bookRevision: APP.bookRevision,
    project: { id:id, name:name || "新しいプロジェクト", createdAt:todayISO(), updatedAt:nowISO() },
    hypotheses: [], vucs: [], seq: { vuc:0, bh:0 },
    settings: { bookPath:"", theme:"auto", thresholds: th }
  };
}
function touchProject(){
  if (!S.data) return;
  S.data.project.updatedAt = nowISO();
  S.dirty = true; S.dirtyCount++;
  autosave();
}
function autosave(){
  if (!S.data) return;
  var ok = lsSet("autosave." + S.data.project.id, S.data);
  if (ok){ S.lastBackupAt = new Date(); rememberRecent(); }
  renderSaveBar();
}
function rememberRecent(){
  var list = lsGet("recent", []), t = thresholds();
  list = list.filter(function(p){ return p.id !== S.data.project.id; });
  list.unshift({ id:S.data.project.id, name:S.data.project.name, updatedAt:S.data.project.updatedAt });
  while (list.length > t.recentProjectsMax){
    var drop = list.pop();
    lsDel("autosave." + drop.id);
  }
  lsSet("recent", list);
}

/* ---- ファイル名の規約（世代番号は付けない。秒までの時刻） ---- */
function fileNameFor(data){
  var slug = String(data.project.name || "project").replace(/[^0-9A-Za-z぀-ヿ一-鿿]+/g, "_").slice(0, 24) || "project";
  return "vucledger_" + slug + "_" + stamp() + ".json";
}
function serialize(){ return JSON.stringify(S.data, null, 2); }

/* ---- 保存層 ---- */
function describe(){
  return S.mode === "overwrite"
    ? "選んだファイルへ上書き保存します（Ctrl+S）"
    : "自動保存は下書き、JSONが正式です";
}
function fallbackToDownload(reason){
  S.mode = "download"; lsSet("forcedDownload", true);
  if (!S.modeNoticeShown){
    S.modeNoticeShown = true;
    toast("この環境では上書き保存が使えないため、JSONの保存に切り替えました" + (reason ? "（" + reason + "）" : ""), "warn");
  }
}
function downloadBlob(text, name, mime){
  var blob = new Blob([text], { type: (mime || "application/json") + ";charset=utf-8" });
  var url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click();
  document.body.removeChild(a); setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}
async function save(){
  if (!S.data) return;
  S.data.project.updatedAt = nowISO();
  var text = serialize(), name = S.handleName || fileNameFor(S.data);
  if (S.mode === "overwrite"){
    try {
      if (!S.handle){
        S.handle = await window.showSaveFilePicker({
          suggestedName: fileNameFor(S.data),
          types: [{ description:"VUC台帳 JSON", accept:{ "application/json":[".json"] } }]
        });
        S.handleName = S.handle.name;
        await idbPut("handle." + S.data.project.id, S.handle);
      } else if (S.handle.queryPermission){
        var p = await S.handle.queryPermission({ mode:"readwrite" });
        if (p !== "granted"){
          p = await S.handle.requestPermission({ mode:"readwrite" });
          if (p !== "granted") throw new Error("権限がありません");
        }
      }
      var w = await S.handle.createWritable();
      await w.write(text); await w.close();
      afterFormalSave(S.handle.name);
      return;
    } catch (err){
      /* AbortError（ダイアログを閉じた）は取り消しであって失敗ではない。モードを落とさない。
         ただし「ダイアログが出せなかった」も同じ AbortError で返る環境があり、区別できない。
         どちらだったとしても、次の一手が分かる文にする（黙って終わらせない） */
      if (err && err.name === "AbortError"){
        toast("保存を取り消しました。\n保存先を選ぶ画面が出なかった場合は、この環境では上書き保存が使えません。"
            + "その場合は下の［保存］をもう一度押すか、［一覧と保存］から JSON を保存してください", "warn");
        return;
      }
      fallbackToDownload(err && err.name ? err.name : "");
      /* 同じ1回の操作を、ダウンロードとして完了させる */
    }
  }
  downloadBlob(text, name.indexOf("vucledger_") === 0 ? name : fileNameFor(S.data), "application/json");
  afterFormalSave(name.indexOf("vucledger_") === 0 ? name : fileNameFor(S.data));
}
async function saveAs(){
  if (S.mode === "overwrite"){ S.handle = null; S.handleName = ""; }
  await save();
}
function afterFormalSave(name){
  var prev = S.lastFormalSave;
  S.dirty = false; S.dirtyCount = 0;
  S.lastFormalSave = { name:name, at:nowISO() };
  lsSet("lastFormalSave", S.lastFormalSave);
  autosave();
  /* 6.5：保存した直後に3つ出す */
  toast("保存しました\n今回のファイル：" + name
      + "\n前回の正式保存：" + (prev ? prev.at + "（" + prev.name + "）" : "なし")
      + "\n次に開くのは、このファイルです");
  renderSaveBar();
}
function openFileDialog(){
  var inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.addEventListener("change", function(){
    var f = inp.files && inp.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function(){ loadFromText(String(r.result), f.name); };
    r.readAsText(f, "utf-8");
  });
  inp.click();
}

/* ---- 読み込み：壊れていても黙って捨てない（E8） ---- */
function parseWithPosition(text){
  try { return { ok:true, value: JSON.parse(text) }; }
  catch (e){
    var msg = String(e.message), m = /position\s+(\d+)/.exec(msg), where = "";
    if (m){
      var pos = Number(m[1]), upto = text.slice(0, pos), line = upto.split("\n").length;
      var col = pos - upto.lastIndexOf("\n");
      where = line + "行目 " + col + "文字目";
    }
    return { ok:false, error:msg, where:where };
  }
}
function loadFromText(text, fname){
  var p = parseWithPosition(text);
  if (!p.ok){
    showSheet("読み込めませんでした", [
      el("p", { text:"JSONとして読めません。部分的に適用した状態では止めていません（データは変えていません）。" }),
      el("p", { class:"note bad", text:(p.where ? "読めなくなった場所：" + p.where + "\n" : "") + p.error }),
      el("p", { class:"small", text:"復旧の手順：1) エディタでその行の前後を見る（多くは末尾の欠落か、カンマの過不足）。2) 直せないときは、ひとつ前に保存したJSONを開く。3) 自動保存された下書きが端末に残っていれば、プロジェクトセレクタから選べる。" })
    ], []);
    return;
  }
  var mig = migrate(p.value);
  if (mig.errors.length){
    showSheet("このファイルは台帳として読めません", [
      el("p", { class:"note bad", text: mig.errors.join("\n") }),
      el("p", { class:"small", text:"復旧の手順：schema が \"" + APP.schema + "\" または \"" + APP.schemaPrev + "\" のファイルを選び直してください。中身が台帳でない場合、このツールでは開けません。" })
    ], []);
    return;
  }
  adoptProject(mig.data);
  var notes = mig.notes.slice();
  if (mig.data.bookRevision !== APP.bookRevision)
    notes.push("本書の版が違います（このファイル：" + mig.data.bookRevision + " ／ ツール内蔵：" + APP.bookRevision + "）。章と節の対応がずれている可能性があります");
  /* 6.5：読み込んだ直後にも3つ出す */
  toast("読み込みました\n最終更新：" + mig.data.project.updatedAt
      + "\nプロジェクト名：" + mig.data.project.name
      + "\nスキーマ：" + mig.data.schema + (fname ? "\nファイル：" + fname : ""));
  if (notes.length) toast(notes.join("\n"), "warn");
}
function adoptProject(data){
  S.data = data;
  S.dirty = false; S.dirtyCount = 0;
  S.focusVuc = null;
  S.handle = null; S.handleName = "";
  normalizeSeq();
  autosave();
  renderAll();
}
function normalizeSeq(){
  if (!S.data.seq) S.data.seq = { vuc:0, bh:0 };
  var maxV = S.data.seq.vuc || 0;
  (S.data.vucs||[]).forEach(function(v){
    var m = /^VUC-(\d+)$/.exec(v.id); if (m) maxV = Math.max(maxV, Number(m[1]));
    if (!v.seqs) v.seqs = { buc:0, suc:0, ac:0, ue:0 };
  });
  S.data.seq.vuc = maxV;                              /* R5：欠番を詰めない・再利用しない */
  var maxB = S.data.seq.bh || 0;
  (S.data.hypotheses||[]).forEach(function(h){
    var m = /^BH-(\d+)$/.exec(h.id); if (m) maxB = Math.max(maxB, Number(m[1]));
  });
  S.data.seq.bh = maxB;
}

/* ---- 6.14 スキーマ移行（vuc-ledger/3 → /4）。値を黙って捨てない ---- */
function migrate(obj){
  var out = { data:null, notes:[], errors:[] };
  if (!obj || typeof obj !== "object"){ out.errors.push("JSONの中身がオブジェクトではありません"); return out; }
  if (!obj.schema){ out.errors.push("schema がありません。このツールのJSONではない可能性があります"); return out; }
  if (obj.schema === APP.schema){ out.data = fillDefaults(obj); return out; }
  if (obj.schema !== APP.schemaPrev){
    out.errors.push("知らないスキーマです：" + obj.schema);
    return out;
  }
  var d = JSON.parse(JSON.stringify(obj));
  d.schema = APP.schema;
  (d.vucs||[]).forEach(function(v){
    /* killed:true → closed、kill → closure */
    if (v.killed !== undefined){
      var k = v.kill || {};
      v.closed = v.killed ? (k.type === "pivot" ? "pivoted" : "killed") : null;
      if (v.killed){
        v.closure = { at: k.at || todayISO(), type: v.closed, category: k.category || "other",
                      reason: k.reason || "", successor: k.successor || null };
      } else v.closure = null;
      delete v.killed; delete v.kill;
    }
    /* unmetEvidence に id と blocks を補う */
    if (!v.seqs) v.seqs = { buc:0, suc:0, ac:0, ue:0 };
    (v.unmetEvidence||[]).forEach(function(u, i){
      if (!u.id){ u.id = "UE-" + String(v.id).replace("VUC-","") + "-" + (i+1); v.seqs.ue = Math.max(v.seqs.ue, i+1); }
      if (!u.blocks) u.blocks = "other";
    });
    /* status / sourceType / sourceNote → source 構造体 */
    CELL_FIELDS.forEach(function(f){
      var cell = getPath(v, f.k);
      if (!cell) return;
      if (f.t !== "pair"){
        if (cell.sourceType || cell.status || cell.sourceNote){
          cell.source = { type: cell.sourceType || "assumption",
                          status: cell.status || "confirmed", note: cell.sourceNote || "" };
        }
        if (cell.blank) cell.source = null;
        delete cell.sourceType; delete cell.status; delete cell.sourceNote;
      } else {
        var oldNote = (typeof cell.source === "string") ? cell.source : null;
        if (!cell.source || typeof cell.source === "string") cell.source = { expected:null, observed:null };
        if (cell.sourceType || cell.status){
          cell.source.expected = { type: cell.sourceType || "assumption",
                                   status: cell.status || "confirmed", note: cell.sourceNote || "" };
        }
        if (oldNote){
          cell.source.observed = cell.source.observed || { type:"measurement", status:"confirmed", note:"" };
          cell.source.observed.note = oldNote;
        }
        delete cell.sourceType; delete cell.status; delete cell.sourceNote;
      }
    });
  });
  if (d.settings && d.settings.lastSeenAt){
    lsSet("lastSeen." + (d.project ? d.project.id : "x"), d.settings.lastSeenAt);
    delete d.settings.lastSeenAt;
    out.notes.push("lastSeenAt は端末側へ移しました（JSONはデータ、閲覧履歴は端末）");
  }
  out.notes.push("vuc-ledger/3 から読み替えました（killed→closed / kill→closure / 根拠を source へ / unmetEvidence に id と blocks を補完 / しきい値を既定で補完）");
  out.data = fillDefaults(d);
  return out;
}
/* 欠落している器を既定で補う。値は上書きしない */
function fillDefaults(d){
  if (!d.project) d.project = { id:"prj_" + Date.now().toString(36), name:"（名前なし）", createdAt:todayISO(), updatedAt:nowISO() };
  if (!d.hypotheses) d.hypotheses = [];
  if (!d.vucs) d.vucs = [];
  if (!d.seq) d.seq = { vuc:0, bh:0 };
  if (!d.settings) d.settings = { bookPath:"", theme:"auto", thresholds:{} };
  if (!d.settings.thresholds) d.settings.thresholds = {};
  PROJECT_THRESHOLD_KEYS.forEach(function(k){
    if (d.settings.thresholds[k] === undefined) d.settings.thresholds[k] = THRESHOLD_DEFAULTS[k];
  });
  if (d.settings.thresholds.setAt === undefined) d.settings.thresholds.setAt = null;
  d.vucs.forEach(function(v){
    var base = newVuc(0);
    if (!v.seqs) v.seqs = { buc:0, suc:0, ac:0, ue:0 };
    if (!v.trace) v.trace = { buc:[], suc:[], ac:[], adr:[] };
    ["buc","suc","ac","adr"].forEach(function(L){ if (!v.trace[L]) v.trace[L] = []; });
    if (!v.gate4) v.gate4 = base.gate4;
    if (!v.economics) v.economics = { tokens:null, observations:[] };
    if (!v.economics.observations) v.economics.observations = [];
    if (!v.stopCriteria) v.stopCriteria = base.stopCriteria;
    if (!v.gate) v.gate = base.gate;
    if (!v.unmetEvidence) v.unmetEvidence = [];
    if (!v.log) v.log = [];
    if (v.closed === undefined) v.closed = null;
    if (v.closure === undefined) v.closure = null;
    if (!v.fields) v.fields = {};
    /* 必須キーが欠落していても [Not measured] で埋める。エラーにしない */
    CELL_FIELDS.forEach(function(f){
      var cell = getPath(v, f.k);
      if (!cell) setPath(v, f.k, f.t === "pair" ? newPairCell(f.units[0] || null) : newSingleCell());
    });
  });
  return d;
}

/* =========================================================================
   3 最小UX：共通の面（トーストと重ねる面、保存状態の1行）
   ========================================================================= */
function toast(msg, kind){
  var box = document.getElementById("toasts");
  var n = el("div", { class:"toast" + (kind ? " " + kind : "") });
  String(msg).split("\n").forEach(function(line, i){
    if (i) n.appendChild(el("br"));
    n.appendChild(document.createTextNode(line));
  });
  box.appendChild(n);
  setTimeout(function(){ if (n.parentNode) n.parentNode.removeChild(n); }, 9000);
  n.addEventListener("click", function(){ if (n.parentNode) n.parentNode.removeChild(n); });
}
/* 重ねる面は1段だけ積める（opts.stack）。ヘルプは編集面の上に開くので、
   下の面をDOMのまま退避して閉じたときに戻す。ノードを作り直さないので、
   書きかけの入力も、［保存］が捕まえている入力欄への参照も生き残る。
   積まずに開く面（別の面へ移る経路）は、下の面を引き継がずに捨てる。 */
var sheetStack = [];
function showSheet(title, body, actions, opts){
  var ov = document.getElementById("overlay"), sh = document.getElementById("sheet");
  if (opts && opts.stack && !ov.hidden && sh.firstChild){
    /* 焦点は外す前に読む。先にノードを外すと、そのときには焦点が body へ移っていて、
       戻り先（押した ? ボタン）を見失う */
    var was = document.activeElement;
    var keep = document.createDocumentFragment();
    while (sh.firstChild) keep.appendChild(sh.firstChild);
    sheetStack.push({ nodes:keep, focus: keep.contains(was) ? was : null });
  } else {
    sheetStack = [];
    sh.innerHTML = "";
  }
  sh.appendChild(el("h2", { id:"ovTitle", text:title }));
  if (opts && opts.canon) sh.appendChild(el("div", { class:"canon", text: opts.canon }));
  if (opts && opts.hint) sh.appendChild(el("p", { class:"note", text: opts.hint }));
  (body||[]).forEach(function(n){ sh.appendChild(n); });
  var bar = el("div", { class:"actions" });
  (actions||[]).forEach(function(a){ bar.appendChild(a); });
  bar.appendChild(el("button", { class:"btn", type:"button", text:"閉じる", onclick:closeSheet }));
  sh.appendChild(bar);
  ov.hidden = false;
  /* 焦点は「いま押せる」最初の1つへ。畳んだ details の中のボタンは querySelector で先に
     見つかるが押せず、渡すと焦点が body へ移る（プロンプトを足して実測で踏んだ）。
     畳んだ中身は getClientRects では見分けられない（Chromium は箱を返す）ので、
     details の open で見る。checkVisibility はまだ無いブラウザがあるので使えるときだけ */
  var cands = sh.querySelectorAll("input,select,textarea,button"), first = null;
  for (var ci = 0; ci < cands.length && !first; ci++){
    var cand = cands[ci];
    if (cand.closest && cand.closest("details:not([open])")) continue;
    if (typeof cand.checkVisibility === "function" ? cand.checkVisibility()
                                                  : cand.getClientRects().length) first = cand;
  }
  if (first) first.focus();
}
function closeSheet(){
  var ov = document.getElementById("overlay"), sh = document.getElementById("sheet");
  sh.innerHTML = "";
  var prev = sheetStack.pop();
  if (prev){
    /* 下に面が残っているときは、1段戻るだけで閉じ切らない */
    sh.appendChild(prev.nodes);
    if (prev.focus && sh.contains(prev.focus)) prev.focus.focus();
    /* 戻り先は書く欄。ラベルの中の ? が先頭に来るので、ボタンは最後に回す */
    else { var back = sh.querySelector("textarea,input,select") || sh.querySelector("button");
           if (back) back.focus(); }
    return;
  }
  ov.hidden = true;
}
document.getElementById("overlay").addEventListener("mousedown", function(e){
  if (e.target.id === "overlay") closeSheet();
});
document.addEventListener("keydown", function(e){
  if (e.key === "Escape" && !document.getElementById("overlay").hidden) closeSheet();
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s"){ e.preventDefault(); save(); }
});

/* =========================================================================
   ヘルプ（? ボタン）：何のために / 何をするか / 例 の3つを必ず出す
   ========================================================================= */
function fieldHelp(f){
  var howMap = {
    single:"文で書きます。分からなければ「まだ測っていない」のままで構いません。測った結果あてはまらないときだけ「該当なし」にします。",
    pair:"期待値と実測値を別々に持ちます（同じ欄に上書きしません）。単位はプルダウンから選びます。",
    enum:"選択肢から選びます。",
    date:"日付を選びます。",
    ref:"既にある事業仮説から選びます。無ければその場で1つ足せます。",
    gate:"通過／不成立／まだ判定していない を選び、根拠を1行書きます。",
    list:"行を足していきます。IDは自動で付きます。",
    derived:"入力欄はありません。ほかの欄から毎回計算しています。",
    id:"自動で付きます。付け替えも再利用もしません。",
    struct:"やめたとき・向きを変えたときに、理由と分類が自動で入ります。"
  };
  var extra = "";
  if (f.units && f.units.length && f.t === "pair") extra = "　単位の候補：" + f.units.join(" / ");
  if (f.t === "enum" && f.units.length) extra = "　選べるもの：" + f.units.join(" / ");
  return {
    t: f.label,
    why: f.hint + (chapterText(f.canon) ? "（本書 " + chapterText(f.canon) + "）" : ""),
    what: (howMap[f.t] || "") + extra,
    ms: FIELD_METHODS[f.k] || [],
    ex: FIELD_EXAMPLES[f.k] || "―",
    wy: FIELD_WAYS[f.k] || null,
    pr: FIELD_PROMPTS[f.k] || []
  };
}
/* 手法の一覧。名前と「この欄でどう使うか」と章だけ。本文は載せない（6.6.4） */
function methodsSec(ms){
  var ul = el("ul", { class:"plain" });
  ms.forEach(function(x){
    var ch = chapterText(x.canon);
    ul.appendChild(el("li", {}, [
      el("div", { class:"mname" }, [

    ]));

  return el("div", { class:"helpsec" }, [

  ]);
}
/* どうやって確かめるか。手段の名前と、それが台帳のどの出所になるかを並べる。
   畳んだ状態で見えるのは手段名と出所だけで、分かることと限界は開いたときに出る
   （プロンプトと同じ理由。always-open にすると「何をするか」と「例」が下へ押し出される）。
   並びは w の順＝その欄に効く順であって、証拠の強さの順ではない。強さは出所の側が持つ */
function waysSec(fw){

    el("h3", { text:"どうやって確かめるか（この欄に効く順）" })
  ]);

    var w = WAY_BY_KEY[k];

    box.appendChild(el("details", { class:"prm" }, [

      ]),

    ]));

  box.appendChild(el("p", { class:"small muted", text:"手段の中身と、どの章を引くかは本書39.13節の索引にあります。"
    + "ここに載せるのは名前と、その手段で埋めたとき出所が何になるかです。出所が弱いと、ゲート判定と段の昇格には使えません" }));
  return box;
}
/* 欄ごとのAIプロンプト。**既定は畳む**。? はまず「何のためか／何をするか／例」を読む場所で、
   本文を開いたまま並べると、その3つが下へ押し出されて本来のヘルプが使えなくなる。
   畳んだ状態で見えるのは、種別（調べる／聞く／試算／点検／下書き）と用途の1行だけ。
   通信はしない。使う人が本文をコピーして、手元のAIに自分で貼る（6.11.1と同じ作法） */
function promptsSec(list){
  var box = el("div", { class:"helpsec" }, [
    el("h3", { text:"AIに聞くときのプロンプト（" + list.length + "件）" }),
    el("p", { class:"small muted", text:"行を押すと本文が開きます。〔　〕は自分の言葉に置き換えてから貼ってください。"
      + "ここから通信はしません。AIが書いた値は出所を「AI下書き」にして入れ、ゲート判定と昇格には使いません" })
  ]);
  list.forEach(function(p){
    var ch = p.canon ? chapterText(p.canon) : "";
    box.appendChild(el("details", { class:"prm" }, [
      el("summary", {}, [ el("span", { class:"prmtag", text:p.g }), document.createTextNode(p.u) ]),
      el("div", { class:"helpex prmbody", text:p.q }),
      el("div", { class:"prmbar" }, [
        el("button", { class:"btn mini", type:"button", text:"コピー",
          onclick:function(e){ e.stopPropagation();
            copyText(p.q, "プロンプトをコピーしました。手元のAIに貼ってください"); } }),
        ch ? el("span", { class:"small muted", text:"本書 " + ch }) : null
      ])
    ]));
  });
  return box;
}
function helpTopic(key){
  if (key.indexOf("field:") === 0){
    var f = FIELD_BY_KEY[key.slice(6)];
    return f ? fieldHelp(f) : null;
  }
  return HELP[key] || null;
}
function showHelp(key){
  var h = helpTopic(key);
  if (!h){ toast("この項目の説明がまだありません：" + key, "warn"); return; }
  var secs = [
    el("div", { class:"helpsec" }, [el("h3", { text:"何のためか" }), el("p", { text:h.why })])
  ];
  if (h.ms && h.ms.length) secs.push(methodsSec(h.ms));

/* その段を宣言するために要る欄を、1つずつ「済み／まだ」で返す（件数や割合にしない）。
   判定そのものは付録Dの required と requiredFilled に任せ、ここでは並べるだけ */
function legStations(vuc, stateKey, T){
  var rule = promotionRule(stateKey);
  if (!rule) return { fields:[], conds:[] };
  return {
    fields: rule.required.map(function(key){
      return { key:key, field:requiredFieldKey(key), label:requiredLabel(key),
               filled: requiredFilled(vuc, key, { judge:true }) };
    }),
    /* 止める条件と、止めない注意（warnStop）を同じ見た目にしない */
    conds: rule.extra.map(function(x){
      return { msg:x.msg, warn: x.kind === "warnStop" };
    })
  };
}

function voyageState(vuc, T){
  var idx = STATE_KEYS.indexOf(vuc.state);
  var nextK = STATE_KEYS[idx + 1] || null;
  var res = nextK ? checkPromotion(vuc, nextK, T) : null;
  return { idx:idx, nextK:nextK, res:res };
}

function openFieldEditor(vucId, key, opts){
  opts = opts || {};
  var vuc = findVuc(vucId);
  if (!vuc) return;

/* 値の入力欄と「この欄の状態」を食い違わせてはいけない。
   値を書いたのに状態が「まだ測っていない」のままだと、保存で入力が消える。
   書いたら状態を「値を書く」へ寄せ、状態を変えて値を捨てるときは必ず知らせる */
function bindValueState(input, sel){
  input.addEventListener("input", function(){
    if (String(input.value).trim() !== "" && sel.value !== "value") sel.value = "value";
  });
  sel.addEventListener("change", function(){
    if (sel.value !== "value" && String(input.value).trim() !== ""){
      input.value = "";
      toast("「" + sel.options[sel.selectedIndex].text + "」を選んだので、書いてあった値を消しました", "warn");
    }
  });
}
function sourceSelect(src){
  var sel = el("select");
  sel.appendChild(el("option", { value:"", text:"（未設定）" }));
  SOURCE_TYPES.forEach(function(s){
    sel.appendChild(el("option", { value:s.k, text:s.label + "：" + s.desc }));
  });
  sel.value = src ? src.type : "";
  return sel;
}
function applyFieldEdit(vuc, f, r){
  var key = f.k;
  if (r.kind === "single"){
    var cell = cellOf(vuc, key), old = cell.blank ? cell.blank : cell.v;
    /* 値が書かれていれば、それは値である。状態が食い違っていても捨てない（silent failure 禁止） */
    if (r.blank !== "na" && r.v !== "") r.blank = "value";
    if (r.blank === "value" && r.v !== ""){
      cell.v = r.v; cell.blank = null;
      cell.source = newSource(r.src || "assumption");
    } else if (r.blank === "na"){
      cell.v = null; cell.blank = "na"; cell.source = null;
    } else {
      cell.v = null; cell.blank = "not_measured"; cell.source = null;
    }
    logChange(vuc, "field", key, old, cell.blank ? cell.blank : cell.v);
  } else if (r.kind === "tokens"){
    var tc = cellOf(vuc, key);
    tc[r.side] = r.v;
    if (!tc.blank) tc.blank = { expected:null, observed:null };
    tc.blank[r.side] = r.v ? null : "not_measured";
    if (!tc.source) tc.source = { expected:null, observed:null };
    tc.source[r.side] = r.v ? newSource(r.src || "assumption") : null;
    logChange(vuc, "field", key + "." + r.side, null, r.v ? "入力あり" : "not_measured");
  } else if (r.kind === "pair"){
    var pc = cellOf(vuc, key), sd = r.side, oldv = pc.blank[sd] ? pc.blank[sd] : pc[sd];
    pc.unit = r.unit || pc.unit;
    if (r.blank !== "na" && r.v !== "") r.blank = "value";
    if (r.blank === "value" && r.v !== ""){
      pc[sd] = Number(r.v); pc.blank[sd] = null;
      /* 人が入力した値の既定は assumption。実測の出所は埋めずに V5 で警告する（6.2.1） */
      pc.source[sd] = r.src ? newSource(r.src) : (sd === "observed" ? null : newSource("assumption"));
    } else if (r.blank === "na"){
      pc[sd] = null; pc.blank[sd] = "na"; pc.source[sd] = null;
    } else {
      pc[sd] = null; pc.blank[sd] = "not_measured"; pc.source[sd] = null;
    }
    logChange(vuc, "field", key + "." + sd, oldv, pc.blank[sd] ? pc.blank[sd] : pc[sd]);
  } else if (r.kind === "gate"){
    var g = getPath(vuc, key), before = g.pass;
    g.pass = r.pass === "true" ? true : (r.pass === "false" ? false : null);
    g.evidence = r.evidence;
    vuc.gate4.result = gateResult(vuc);
    logChange(vuc, "field", key, before, g.pass);
  } else {
    var was = getPath(vuc, key);
    setPath(vuc, key, r.v);
    if (key.indexOf("stopCriteria.") === 0 && !vuc.stopCriteria.writtenAt && stopCriteriaWritten(vuc)){
      vuc.stopCriteria.writtenAt = todayISO();
    }
    logChange(vuc, "field", key, was, r.v);
  }
  vuc.assurance = computeAssurance(vuc);
  /* 未充足エビデンスの自動検出：関連欄が埋まったら「解決できていませんか？」 */
  (vuc.unmetEvidence||[]).forEach(function(u){
    if (!u.resolvedAt && u.field === key && requiredFilled(vuc, key)) u._askResolve = true;
  });
  var v5 = validate(vuc, "save", st()).filter(function(x){ return x.id === "V5"; });
  if (v5.length) toast(v5[0].msg, "warn");
  /* 航海が進んだことを、その場で伝える（残りの件数だけ。割合にはしない） */
  var vsNow = voyageState(vuc, st());
  if (vsNow.nextK && vsNow.res){
    var left = vsNow.res.missing.length;
    if (left === 0) toast(vsNow.nextK + " に向けて確かめる欄は、すべて埋まりました。上げるかどうかは［測る・判定する］で決めます");
    else toast(vsNow.nextK + " に向けて確かめ終えるもの：残り " + left + "件");
  }
  touchProject();
}
